# A frozen extract of docs/api/openapi.yaml (2026-11-04) for the tests of the generated-spec
# check: seven operations and the components they use, without descriptions, examples and headers,
# which the check doesn't compare. The tests build their routes against this file, so a change to
# the contract doesn't break them. The contract itself is checked against the service
# by test_the_service_matches_the_contract, and by CI (docs/api/README.md, section 11.1).
openapi: 3.1.0
info:
  title: secure-file-transfer API
  version: 1.0.0-draft
servers:
- url: /v1
paths:
  /auth/sign-in:
    get:
      operationId: startSignIn
      x-permission: public
      security: []
      parameters:
      - name: method
        in: query
        required: true
        schema:
          type: string
          enum: [sso, local]
      - name: sso_domain
        in: query
        required: false
        schema:
          type: string
          format: hostname
          maxLength: 253
      - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          description: Redirect to Cognito managed login.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/sign-out:
    post:
      operationId: signOut
      x-permission: account.sign_out
      security:
      - memberSession: []
        csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignOutResult'
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /files/{file_id}:
    parameters:
    - $ref: '#/components/parameters/FileId'
    delete:
      operationId: deleteFile
      x-permission: file.delete
      security:
      - memberSession: []
        csrfToken: []
      - tenantApiKey: ['transfers:write']
      - tenantApiKey: ['upload_requests:write']
      responses:
        '204':
          description: The file was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /files/{file_id}/downloads/{grant_id}/content:
    parameters:
    - $ref: '#/components/parameters/FileId'
    - $ref: '#/components/parameters/GrantId'
    get:
      operationId: getReceivedFileDownloadContent
      x-permission: file.download_received
      security:
      - memberSession: []
      parameters:
      - $ref: '#/components/parameters/Range'
      - $ref: '#/components/parameters/IfRange'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '206':
          $ref: '#/components/responses/PartialFileContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users:
    get:
      operationId: listUsers
      x-permission: user.read
      security:
      - memberSession: [admin]
      parameters:
      - $ref: '#/components/parameters/UserRoleFilter'
      - $ref: '#/components/parameters/UserStatusFilter'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
          description: One page of users.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/{user_id}/sign-out:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      operationId: signOutUser
      x-permission: user.sign_out
      security:
      - memberSession: [admin]
        csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The user, whose sessions have all ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /operator/tenants:
    servers:
    - url: https://127.0.0.1:{local_port}/v1
    post:
      operationId: createTenant
      x-permission: operator.tenant.create
      security:
      - operatorToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
          description: The tenant and its first admin were created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    GrantId:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    IfRange:
      name: If-Range
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
        pattern: ^bytes=(\d+-\d*|-\d+)$
    ReturnTo:
      name: return_to
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
        default: /
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserRoleFilter:
      name: role
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Role'
    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UserStatus'
  responses:
    BadRequest:
      description: BadRequest.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: NotFound.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RangeNotSatisfiable:
      description: RangeNotSatisfiable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: ServiceUnavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: TooManyRequests.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: UnexpectedError.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: UnprocessableContent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    FileContent:
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
      description: The whole file, streamed.
    PartialFileContent:
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
      description: The requested range of the file, streamed, with the same headers as a `200`.
  schemas:
    EmailAddress:
      type: string
      format: email
      maxLength: 254
    Id:
      type: string
      format: uuid
    Locale:
      type: string
      enum: [en, ja]
    NextCursor:
      type: [string, 'null']
    Role:
      type: string
      enum: [admin, member]
    SignOutRequest:
      type: object
      additionalProperties: false
      properties:
        all_sessions:
          type: boolean
          default: false
    SignOutResult:
      type: object
      required: [logout_url]
      properties:
        logout_url:
          type: string
          format: uri
    Tenant:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, first_admin_email, recovery_contact]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        first_admin_email:
          $ref: '#/components/schemas/EmailAddress'
        recovery_contact:
          type: string
          minLength: 1
          maxLength: 320
        default_locale:
          $ref: '#/components/schemas/Locale'
          default: en
    TenantCreated:
      type: object
      required: [tenant, first_admin]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        first_admin:
          $ref: '#/components/schemas/User'
    Timestamp:
      type: string
      format: date-time
    User:
      type: object
      required: [id, email, role, status, sso_fallback, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/EmailAddress'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        sso_fallback:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {$ref: '#/components/schemas/ProblemCode'}
        request_id: {type: string}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        attempts_remaining: {type: integer, minimum: 0}
        current_state: {type: string}
    ProblemCode:
      type: string
      enum:
      - malformed_request
      - invalid_cursor
      - authentication_required
      - session_expired
      - credentials_invalid
      - reauthentication_required
      - permission_denied
      - passkey_required
      - self_approval_forbidden
      - csrf_failed
      - recipient_locked
      - download_limit_reached
      - download_grant_exhausted
      - not_found
      - link_not_found
      - method_not_allowed
      - idempotency_conflict
      - idempotency_in_progress
      - invalid_state
      - transfer_revoked
      - transfer_expired
      - upload_request_revoked
      - upload_request_expired
      - transfer_empty
      - upload_incomplete
      - file_not_shareable
      - user_exists
      - last_admin
      - dlp_decision_changed
      - dlp_policy_conflict
      - detector_in_use
      - no_eligible_approver
      - approval_limit_reached
      - link_revoked
      - link_expired
      - file_too_large
      - total_too_large
      - storage_quota_exceeded
      - request_too_large
      - unsupported_media_type
      - range_not_satisfiable
      - validation_failed
      - expiry_out_of_range
      - recipient_domain_not_allowed
      - recipient_undeliverable
      - too_many_files
      - upload_size_mismatch
      - code_invalid
      - code_expired
      - code_attempts_exhausted
      - export_too_large
      - justification_required
      - approvers_insufficient
      - rate_limited
      - internal_error
      - service_unavailable
    ValidationIssue:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
        pointer: {type: string}
        parameter: {type: string}
        header: {type: string}
