[project]
name = "sft"
version = "0.1.0"
description = "The secure-file-transfer backend: the API service now, and the workers later, from one codebase (ADR-0002)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "prometheus-client>=0.23",
  "pydantic-settings>=2.16",
  # SQLAlchemy 2.0 as ADR-0002 names it; 2.1 is a deliberate upgrade, not a Dependabot bump.
  "sqlalchemy[asyncio]>=2.0.55,<2.1",
  # The binary wheel bundles libpq, so the slim image needs no system packages.
  "psycopg[binary]>=3.3.6",
  "alembic>=1.20.1",
  # Email (#100): Jinja2 renders the fixed templates with autoescaping (sft.service.email).
  "jinja2>=3.1.6",
  # The AWS SDK: SQS for the workers (sft.workers.queues) and the SES API v2 behind the mail
  # adapter (sft.data.mail, ADR-0015). It is synchronous, so callers run it in a thread pool of
  # their own (ADR-0002); M4's IAM database tokens are signed with it too.
  "boto3>=1.43.120",
]

[dependency-groups]
dev = [
  "httpx2>=2.13",
  "import-linter>=2.15",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "pyyaml>=6.0.3",  # the generated-spec check reads the contract (tools/contract_check.py)
  "ruff>=0.17",
  "types-boto3[sesv2,sqs]>=1.43.120",  # mypy types for the SQS and SES clients
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft"]

# The alembic command line, for developers (`uv run alembic …`, README). The migration job builds
# its configuration in code (sft.data.migrate), so the image needs neither this nor an alembic.ini.
# New revisions are numbered in sequence: `uv run alembic revision --rev-id 0002 -m "…"`.
[tool.alembic]
script_location = "%(here)s/src/sft/data/migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "S",             # bandit (security)
  "N",             # naming
  "PT",            # pytest style
  "ASYNC",         # async pitfalls
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are how pytest works

[tool.mypy]
strict = true
mypy_path = "src:."
packages = ["sft", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so the tests import tools
addopts = "-q --cov=sft --cov=tools --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
# Also measure the server started as a real process by the signal tests.
patch = ["subprocess"]

# The layers of ADR-0002, checked by `lint-imports` (make lint, CI). A layer may import the layers below it, never
# the ones above. `workers` sits beside `api`, and neither imports the other; `runtime` holds what both entry points
# need to run as a pod (the probes and metrics listener). `exhaustive` fails the check when a new subpackage of `sft`
# isn't placed in a layer.
[tool.importlinter]
root_package = "sft"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api | workers -> runtime -> service -> data -> core"
type = "layers"
containers = ["sft"]
layers = [
  "api | workers",
  "runtime",
  "service",
  "data",
  "core",
]
exhaustive = true
broken_contract_guidance = "Move the shared code down to the lowest layer that needs it (ADR-0002)."

[[tool.importlinter.contracts]]
name = "Only the entry points know about HTTP"
type = "forbidden"
source_modules = ["sft.service", "sft.data", "sft.core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
