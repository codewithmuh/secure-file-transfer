[project]
name = "sft"
version = "0.1.0"
description = "The secure-file-transfer backend: the API service now, and the workers later, from one codebase (ADR-0002)."
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54",
  "prometheus-client>=0.23",
  "pydantic-settings>=2.16",
  # SQLAlchemy 2.0 as ADR-0002 names it; 2.1 is a deliberate upgrade, not a Dependabot bump.
  "sqlalchemy[asyncio]>=2.0.55,<2.1",
  # The binary wheel bundles libpq, so the slim image needs no system packages.
  "psycopg[binary]>=3.3.6",
  "alembic>=1.20.1",
  # Traces (ADR-0009). The SDK and the exporter release in step with opentelemetry-api, which
  # FastAPI already needs, so all three move together: pinned, not bumped one at a time.
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  # OTLP over HTTP/protobuf to the node's collector; the gRPC exporter would add grpcio.
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  # Email (#100): Jinja2 renders the fixed templates with autoescaping (sft.service.email).
  "jinja2>=3.1.6",
  # The AWS SDK: SQS for the workers (sft.workers.queues) and the SES API v2 behind the mail
  # adapter (sft.data.mail, ADR-0015). It is synchronous, so callers run it in a thread pool of
  # their own (ADR-0002); M4's IAM database tokens are signed with it too.
  "boto3>=1.43.121",
  # The rate-limit counters (ADR-0014): the Valkey project's own client, pure Python, asyncio.
  "valkey>=6.2.0",
  # DLP detectors (ADR-0022): RE2 for patterns that run in linear time, libphonenumber's metadata.
  "google-re2>=1.1.20251105",
  "phonenumbers>=9.0.42",
  # Member sign-in (ADR-0016, #113). The OIDC code flow with PKCE is a redirect, one form POST and
  # one revocation; the security-critical part is the ID token's signature and claims, which joserfc
  # (BSD-3-Clause, the Authlib author's JOSE library) checks against the pool's published keys. The
  # cap holds 1.8.0 (2026-11-03) back until it is 7 days old (threat model T-68); lift it then.
  "joserfc>=1.7.7,<1.8",
  # The HTTP client for the OIDC discovery, token and revocation calls; the tests use it too.
  "httpx2>=2.16.0",
  # DLP text extraction (ADR-0022): XML with DTDs, entities and network off, and PDF text through PDFium
  # (the default wheels, built without V8 or XFA).
  "lxml>=6.1.3",
  "pypdfium2>=5.14.0",
  # TLS on the API's public port (#184, encryption and keys 2.2): the ECDSA key and self-signed
  # certificate each pod makes at start. Already in the lock through joserfc; 50.0.2 is 2026-09-30.
  "cryptography>=50.0.2",
  # Tenant SSO (#231): proving an email domain reads its DNS TXT record (authn-authz 2.5). The
  # resolver is async and pure Python. 2.9.1 is 2026-10-29; the cap holds 2.9.2 (2026-11-03) back
  # until it is 7 days old (threat model T-68); lift it then.
  "dnspython>=2.9.1,<2.9.2",
]

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.0",
  "pyyaml>=6.0.3",  # the generated-spec check reads the contract (tools/contract_check.py)
  "ruff>=0.17.3",
  "types-boto3[cognito-idp,s3,secretsmanager,sesv2,sqs]>=1.43.121",  # mypy types for the AWS clients
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft"]

# The alembic command line, for developers (`uv run alembic …`, README). The migration job builds
# its configuration in code (sft.data.migrate), so the image needs neither this nor an alembic.ini.
# New revisions are numbered in sequence: `uv run alembic revision --rev-id 0002 -m "…"`.
[tool.alembic]
script_location = "%(here)s/src/sft/data/migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "S",             # bandit (security)
  "N",             # naming
  "PT",            # pytest style
  "ASYNC",         # async pitfalls
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are how pytest works

[tool.mypy]
strict = true
mypy_path = "src:."
packages = ["sft", "tools"]

# google-re2 ships no type information; sft.dlp.detect.regex wraps the few calls it makes.
[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true

# Neither ships type information; the DLP extractors wrap them in typed helpers (sft.dlp.extract).
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so the tests import tools
addopts = "-q --cov=sft --cov=tools --cov-report=term-missing --cov-fail-under=80"
# The M2 journey (#182) runs only against the local stack, with `make e2e`: SFT_E2E=1 turns it on.
markers = ["e2e: the end-to-end journey against `make up` (skipped unless SFT_E2E=1)"]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio runs the driver in greenlets; without this, lines after an await inside a
# transaction go unmeasured.
concurrency = ["thread", "greenlet"]
# Also measure the server started as a real process by the signal tests.
patch = ["subprocess"]

# The layers of ADR-0002, checked by `lint-imports` (make lint, CI). A layer may import the layers below it, never
# the ones above. `workers` sits beside `api`, and neither imports the other; `runtime` holds what both entry points
# need to run as a pod (the probes and metrics listener). `exhaustive` fails the check when a new subpackage of `sft`
# isn't placed in a layer.
[tool.importlinter]
root_package = "sft"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api | workers | probe -> runtime -> service -> data | dlp -> core"
type = "layers"
containers = ["sft"]
layers = [
  "api | workers | probe",
  "runtime",
  "service",
  "data | dlp",
  "core",
]
exhaustive = true
broken_contract_guidance = "Move the shared code down to the lowest layer that needs it (ADR-0002)."

[[tool.importlinter.contracts]]
name = "Only the entry points know about HTTP"
type = "forbidden"
source_modules = ["sft.service", "sft.data", "sft.core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

# `dlp` sits beside `data`: pure code that the service and the inspector both use. The inspector's sandbox reaches no
# database, counter store, AWS, network or secret (ADR-0022), so the package imports none of their clients and
# exports no metrics or traces.
[[tool.importlinter.contracts]]
name = "The dlp package reaches no database, counter store, AWS, HTTP, metrics or traces"
type = "forbidden"
source_modules = ["sft.dlp"]
forbidden_modules = [
  "sqlalchemy", "psycopg", "alembic",
  "valkey",
  "boto3", "botocore",
  "fastapi", "starlette", "uvicorn",
  "prometheus_client", "opentelemetry",
]

# The synthetic probe (#248, NFR-1) measures the service as a customer sees it: through the public API, with HTTP and
# the mailbox only. It may use `core` (settings, logs) and nothing that reaches the database or the queues.
[[tool.importlinter.contracts]]
name = "The probe sees the service only through its public API"
type = "forbidden"
source_modules = ["sft.probe"]
forbidden_modules = [
  "sft.api", "sft.workers", "sft.runtime", "sft.service", "sft.data", "sft.dlp",
  "sqlalchemy", "psycopg", "alembic", "valkey", "fastapi", "starlette", "uvicorn",
]
