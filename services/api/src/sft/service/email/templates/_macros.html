{# Shared HTML pieces. Values are escaped like any other. #}
{% macro button(url, label, copy_hint) %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 16px;">
<tr><td style="border-radius:6px;background-color:#0b5cad;">
<a href="{{ url }}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-weight:600;text-decoration:none;border-radius:6px;">{{ label }}</a>
</td></tr>
</table>
<p style="margin:0 0 16px;font-size:13px;color:#59636e;">{{ copy_hint }}<br><span style="word-break:break-all;">{{ url }}</span></p>
{% endmacro %}
{% macro secret(label, value) %}
<p style="margin:0 0 4px;font-size:14px;color:#59636e;">{{ label }}</p>
<p style="margin:0 0 16px;font-family:Menlo,Consolas,monospace;font-size:24px;font-weight:600;letter-spacing:2px;">{{ value }}</p>
{% endmacro %}
