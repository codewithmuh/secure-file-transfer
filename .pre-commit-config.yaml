# Fast checks before every commit. Install once with `make setup` (runs `pre-commit install`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests and test fixtures hold several documents. Helm templates are Go templates, not YAML,
        # until rendered; `helm lint` and `helm template` check those.
        args: [--allow-multiple-documents]
        exclude: (/charts/[^/]+/templates/|^deploy/argocd/templates/)
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # The hook is built with Go. The repo has no Go toolchain, so pin the one pre-commit downloads.
        language_version: 1.27.3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
