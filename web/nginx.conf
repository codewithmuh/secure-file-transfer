# The web app's server in the local stack (#195): what CloudFront does in AWS (ADR-0008, infra/modules/web-cdn),
# with the local origins. The browser reaches it at http://localhost:3000; compose publishes 8080 there.

# Hashed bundle files never change, so they are cached for good; everything else, index.html and config.json above
# all, and any error, is revalidated on every load, so a new build or a new config is picked up at once.
map "$status:$uri" $sft_cache_control {
    "~^200:/assets/" "public, max-age=31536000, immutable";
    default          "no-cache";
}

# http://127.0.0.1:3000 goes to http://localhost:3000: the API checks Origin against WEB_ORIGIN exactly, and cookies
# are kept per host name, so every unsafe request from 127.0.0.1 would fail. The container's own health check uses
# 127.0.0.1:8080, which stays as it is.
map $http_host $sft_not_localhost {
    "~^127\.0\.0\.1:3000$" 1;
    default                0;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CloudFront's response headers policy, with the local origins: the API on :8000 and the S3 stand-in on :9090
    # (part uploads). No inline script and no third-party origin (T-02). `form-action` names the API as well. No HSTS:
    # the stack is plain http on localhost, which browsers treat as a secure context.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:9090; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self' http://localhost:8000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # The link token lives in the URL fragment, which is never sent, but no referrer is the rule (ADR-0008).
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $sft_cache_control always;

    if ($sft_not_localhost) {
        return 308 http://localhost:3000$request_uri;
    }

    # A path whose last segment has a file extension is a file: served, or 404. A missing asset stays a 404.
    location ~ "/[^/]*\.[^/]*$" {
        try_files $uri =404;
    }

    # Every other path is an app route: index.html, and the router takes it from there (CloudFront's routes.js).
    location / {
        try_files /index.html =404;
    }
}
