# Local run of every service with production-like hardening: `make up`, then `make down`.
# Settings come from your shell or a `.env` file (see .env.example); defaults below.
name: secure-file-transfer

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build:
      context: ./services/api
      args: { APP_VERSION: local }
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # 8000: the API. 8001: /healthz, /readyz and /metrics, which the cloud load balancer never routes.
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8001:8001"]
    stop_grace_period: 30s # more than the 20 s drain; Compose's default 10 s would SIGKILL mid-drain
