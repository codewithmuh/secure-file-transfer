# Local run of every service and the local stack, with production-like hardening: `make up`, then `make down`.
# The stack stands in for AWS on a laptop (docs/local-development.md); every credential in it is local-only and fake.
# Settings come from your shell or a `.env` file (see .env.example); defaults below.
name: secure-file-transfer

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

# The API image. The database jobs and the workers run from it too, as in AWS; the build is cached,
# so each service that names it costs a tag, not a rebuild.
x-api-image: &api-image
  build:
    context: ./services/api
    args: { APP_VERSION: local }

# A workload starts only once its database is ready: roles, local passwords and migrations
# (docs/local-development.md 3).
x-database-ready: &database-ready
  db-migrate: { condition: service_completed_successfully }

services:
  api:
    <<: [*hardening, *api-image]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Its own login role, never a superuser, so row-level security applies (ADR-0020). Fixed
      # here, not read from .env, whose DATABASE_URL is for code on the host. The password is
      # local-only; the API connects only when a request needs the database.
      DATABASE_URL: postgresql://sft_api:test-only-password@postgres:5432/sft
      # The rate-limit counters (ADR-0014), as the stack's local ACL user. Required; connected on
      # first use, so the API starts without it, and limits that fail open then count per pod.
      VALKEY_URL: redis://sft-local:local-only-valkey-password@valkey:6379/0
      # Member sign-in (ADR-0016, #113): the sign-in state lives in Valkey, Keycloak stands in for the
      # pool. The browser knows the issuer by its host name; the API reads its configuration in-network.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      OIDC_ISSUER: http://localhost:8180/realms/sft
      OIDC_DISCOVERY_URL: http://oidc:8080/realms/sft/.well-known/openid-configuration
      OIDC_CLIENT_ID: sft-api-local
      OIDC_CLIENT_SECRET: local-only-oidc-client-secret
      OIDC_REDIRECT_URI: http://localhost:8000/v1/auth/callback
      OIDC_LOGOUT_URL: http://localhost:8180/realms/sft/protocol/openid-connect/logout
      OIDC_PROVIDER_NAME: local-keycloak
      # Tenant SSO (#231): Keycloak takes the provider as `kc_idp_hint`; the seed proves the local
      # tenant's domain itself, so this DNS stand-in only serves domains an admin claims by hand.
      OIDC_IDP_HINT_PARAMETER: kc_idp_hint
      SSO_DNS_OVERRIDES: '{}'
      # K_csrf: one obviously fake key, 32 bytes of "x" in base64.
      CSRF_KEYRING: '[{"id":"local","state":"active","key":"eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="}]'
      # The email-hmac keyring (#145), per-address rate limits' pseudonyms: 32 bytes of "y".
      EMAIL_HMAC_KEYRING: &email-keyring '[{"id":"local","state":"active","key":"eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXk=","activated_at":"2026-01-01T00:00:00Z"}]'
      # The files buckets (#114, ADR-0012) on the S3 stand-in, with the files key's bare ID. The SDK signs part
      # URLs with fake keys; S3Mock checks no signature. Every S3 call goes to the in-network host `s3`, but part
      # URLs name `localhost:9090`, where the browser reaches the stand-in (#195): S3Mock checks no signature, so
      # the different host costs nothing. In AWS neither is set.
      S3_ENDPOINT_URL: http://s3:9090
      S3_PRESIGN_ENDPOINT_URL: http://localhost:9090
      S3_FILES_BUCKET: sft-local-files
      S3_LARGE_FILES_BUCKET: sft-local-large-files
      S3_FILES_KMS_KEY_ID: 00000000-0000-4000-8000-000000000001
      # The audit archive of both regions (#177): security-critical records go to each before a 2xx. The second
      # bucket stands in for Osaka's, on the same S3 stand-in.
      AUDIT_ARCHIVE_TOKYO_BUCKET: sft-local-audit-archive
      AUDIT_ARCHIVE_TOKYO_ENDPOINT_URL: http://s3:9090
      AUDIT_ARCHIVE_OSAKA_BUCKET: sft-local-audit-archive-osaka
      AUDIT_ARCHIVE_OSAKA_ENDPOINT_URL: http://s3:9090
      # K_code (#179), which checks verification codes: 32 bytes of "z".
      CODE_HMAC_KEYRING: &code-keyring '[{"id":"local","state":"active","key":"enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno="}]'
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
      # The local stack (#182): the only environment, with test, where the clock's test hook may be
      # set. It stays 0 here; the journey test moves the lifecycle jobs' clock, never the API's.
      ENVIRONMENT: local
      # API keys (#215): local keys are `sft_dev_…`, and their hashes exist only in this database.
      API_KEY_ENVIRONMENT: dev
      # Field encryption (#236, #233): the in-process KMS stand-in, which binds the encryption
      # context as KMS does; in AWS the fields key's alias, `alias/sft/<env>/fields`.
      FIELDS_KMS_KEY_ID: local
    # 8000: the API. 8001: /healthz, /readyz and /metrics, which the cloud load balancer never routes.
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8001:8001"]
    stop_grace_period: 30s # more than the 20 s drain; Compose's default 10 s would SIGKILL mid-drain
    depends_on:
      <<: *database-ready
      # The buckets. Depending on the one-shot also lets `up --wait` accept its exit on a re-run.
      s3-init: { condition: service_completed_successfully }

  notifier: # the notification worker (#178, #179): link emails, codes and notices, into Mailpit
    <<: [*hardening, *api-image]
    command: ["python", "-m", "sft.workers.notify"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Its own login role: it reads addresses and links, never a file name or a message (revision 0012).
      DATABASE_URL: postgresql://sft_notify:test-only-password@postgres:5432/sft
      VALKEY_URL: redis://sft-local:local-only-valkey-password@valkey:6379/0 # the cross-tenant cap on link emails
      SQS_ENDPOINT_URL: http://sqs:9324
      SQS_QUEUE_PREFIX: sft-local-
      MAIL_BACKEND: smtp
      MAIL_FROM_ADDRESS: no-reply@mail.sft.localhost
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      WEB_APP_URL: ${WEB_ORIGIN:-http://localhost:3000}
      EMAIL_HMAC_KEYRING: *email-keyring
      CODE_HMAC_KEYRING: *code-keyring
      # K_link, which only this worker reads: 32 bytes of "w".
      LINK_HMAC_KEYRING: '[{"id":"local","state":"active","key":"d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3c="}]'
      # The user pool's admin side (#197): an invited member's Keycloak user with a temporary password,
      # its identity, then the invitation through Mailpit. Only this worker may manage the pool's users.
      USER_POOL_BACKEND: keycloak
      USER_POOL_PROVIDER_NAME: local-keycloak
      KEYCLOAK_URL: http://oidc:8080
      KEYCLOAK_REALM: sft
      KEYCLOAK_CLIENT_ID: sft-notify-local
      KEYCLOAK_CLIENT_SECRET: local-only-notify-pool-secret
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    ports: ["127.0.0.1:8014:8001"] # /healthz, /readyz and /metrics
    stop_grace_period: 25s # more than the 15 s drain
    depends_on:
      <<: *database-ready
      sqs: { condition: service_healthy }
      valkey: { condition: service_healthy }
      mail: { condition: service_healthy }
      oidc: { condition: service_healthy }

  web: # the web app (#195): the production bundle behind nginx, on its own origin as in AWS (ADR-0008)
    <<: *hardening
    build: { context: ./web }
    # The local origins: the API on :8000, the S3 stand-in on :9090 for part uploads, Keycloak on :8180 for
    # sign-out. Mounted, never built in, like CloudFront's config.json: one bundle for every environment.
    volumes: ["./local/web/config.json:/usr/share/nginx/html/config.json:ro"]
    # Always http://localhost:3000, never 127.0.0.1 (which redirects here): the API checks Origin against
    # WEB_ORIGIN exactly, and cookies are per host name.
    ports: ["127.0.0.1:3000:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/config.json"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  # ---- The scan pipeline (ADR-0019, ADR-0022; #175, #176): one worker per pool, beside clamd and the DLP inspector ----

  scan-worker-small: &scan-worker # files up to 100 MB, from the scan-small queue
    <<: [*hardening, *api-image]
    command: ["python", "-m", "sft.workers.scan"]
    environment: &scan-worker-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCAN_POOL: small
      # Its own login role: it reads no file name or message, and may not read findings back (data model 4.2).
      DATABASE_URL: postgresql://sft_scan:test-only-password@postgres:5432/sft
      VALKEY_URL: redis://sft-local:local-only-valkey-password@valkey:6379/0 # the per-tenant scan caps
      SQS_ENDPOINT_URL: http://sqs:9324
      SQS_QUEUE_PREFIX: sft-local-
      S3_ENDPOINT_URL: http://s3:9090
      S3_FILES_BUCKET: sft-local-files
      S3_LARGE_FILES_BUCKET: sft-local-large-files
      CLAMD_HOST: clamd
      INSPECTOR_HOST: inspector
      SCAN_LARGE_POOL_SIZE: "2"
      # DLP data keys (#233): the KMS stand-in, allowing this worker `dlp-dek` only, as the key policy.
      FIELDS_KMS_KEY_ID: local
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    # The default network for the stack, and the inspector's, which has no way out.
    networks: [default, inspection]
    ports: ["127.0.0.1:8012:8001"] # /healthz, /readyz and /metrics; 8021 is macOS's ftp-proxy socket
    stop_grace_period: 25s # more than the 15 s drain
    depends_on:
      <<: *database-ready
      s3-init: { condition: service_completed_successfully }
      sqs: { condition: service_healthy }
      valkey: { condition: service_healthy }
      clamd: { condition: service_healthy }
      inspector: { condition: service_started }

  scan-worker-large: # files over 100 MB, up to 2 GB, from the scan-large queue
    <<: *scan-worker
    environment:
      <<: *scan-worker-env
      SCAN_POOL: large
    ports: ["127.0.0.1:8013:8001"]

  guardduty: # GuardDuty Malware Protection's stand-in (#234): scans the large-files bucket, tags, sends the result
    <<: [*hardening, *api-image]
    command: ["python", "-m", "sft.workers.guardduty_standin"]
    # It serves no probe port, so the image's check (the internal port's /healthz) would mark it unhealthy and stop
    # `make up`'s wait (#241), and `--wait` refuses a long-running service with no check at all. The process being
    # alive is all there is to check: a crash exits the container, which the wait sees.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local # it refuses to start anywhere else
      S3_ENDPOINT_URL: http://s3:9090
      S3_LARGE_FILES_BUCKET: sft-local-large-files
      SQS_ENDPOINT_URL: http://sqs:9324
      SQS_QUEUE_PREFIX: sft-local-
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    depends_on:
      s3-init: { condition: service_completed_successfully }
      sqs: { condition: service_healthy }

  inspector: # the DLP inspector (ADR-0022): our image, its own entry point, no credentials
    <<: [*hardening, *api-image]
    command: ["python", "-m", "sft.dlp.inspector"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INSPECTOR_SCRATCH_DIR: /scratch
      # Listen on the container's interface, as the pod does: the default 127.0.0.1 would be unreachable from the
      # scan workers. The inspection network is internal, so nothing else can reach it.
      BIND_HOST: 0.0.0.0
    # 4 GiB of scratch for the file it inspects, in memory locally; nothing else is writable.
    tmpfs: [/tmp, "/scratch:size=4g,uid=10001,gid=10001,mode=0700"]
    # Only on the inspection network, which is internal: it reaches neither the database, the counter store, nor
    # anything outside, and only the scan workers reach it (local/smoke.py checks both).
    networks: [inspection]
    # Its framed protocol is on 8070, one file per connection; its probes on 8001, plain HTTP from a thread (#184,
    # deploy/README.md), so a check never reaches the protocol. Ready once it listens. `make up --wait` needs a check.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/readyz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 35s

  # ---- The lifecycle jobs (#181): one-shot commands, never started by `make up` ----
  # `make jobs JOB=expiry|deletion|reconciliation|storage-audit|cleanup|purge|audit-partitions` runs one, as the
  # chart's CronJobs do (architecture 4.5). CLOCK_OFFSET_SECONDS is the clock's test hook (#182), refused outside
  # ENVIRONMENT=local or test; the journey test sets it to move a transfer past its expiry.
  jobs:
    <<: [*hardening, *api-image]
    profiles: [jobs]
    restart: "no"
    entrypoint: ["python", "-m", "sft.workers.jobs"]
    command: ["reconciliation"]
    healthcheck: { disable: true } # the image's check is the API's probe port
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local
      CLOCK_OFFSET_SECONDS: ${CLOCK_OFFSET_SECONDS:-0}
      # ADR-0019's split between the scan pools, as the API's own default: reconciliation routes a
      # completion it finishes by it (#181). Change both together.
      SCAN_SMALL_POOL_MAX_BYTES: "100000000"
      # Its own login role: it finds work across tenants read only, and acts in each tenant's
      # scope; the only role that deletes objects and expired rows (revision 0015).
      DATABASE_URL: postgresql://sft_jobs:test-only-password@postgres:5432/sft
      S3_ENDPOINT_URL: http://s3:9090
      S3_FILES_BUCKET: sft-local-files
      S3_LARGE_FILES_BUCKET: sft-local-large-files
      # Reconciliation rewrites a download grant's committed record in both archives (#180).
      AUDIT_ARCHIVE_TOKYO_BUCKET: sft-local-audit-archive
      AUDIT_ARCHIVE_TOKYO_ENDPOINT_URL: http://s3:9090
      AUDIT_ARCHIVE_OSAKA_BUCKET: sft-local-audit-archive-osaka
      AUDIT_ARCHIVE_OSAKA_ENDPOINT_URL: http://s3:9090
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    depends_on:
      <<: *database-ready
      s3-init: { condition: service_completed_successfully }

  # ---- The audit archive job (#183): one-shot, never started by `make up` ----
  # `make audit-archive` runs one pass, as the chart's every-minute CronJob does: committed audit events to both
  # archive buckets of the S3 stand-in, as gzipped JSON lines under g<generation>/. Its own login role reads audit
  # events and moves the archive cursor, nothing else (revision 0034).
  audit-archive:
    <<: [*hardening, *api-image]
    profiles: [jobs]
    restart: "no"
    entrypoint: ["python", "-m", "sft.workers.audit_archive"]
    command: []
    healthcheck: { disable: true } # the image's check is the API's probe port
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://sft_archive:test-only-password@postgres:5432/sft
      AUDIT_ARCHIVE_TOKYO_BUCKET: sft-local-audit-archive
      AUDIT_ARCHIVE_TOKYO_ENDPOINT_URL: http://s3:9090
      AUDIT_ARCHIVE_OSAKA_BUCKET: sft-local-audit-archive-osaka
      AUDIT_ARCHIVE_OSAKA_ENDPOINT_URL: http://s3:9090
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    depends_on:
      <<: *database-ready
      s3-init: { condition: service_completed_successfully }

  # ---- The field key job (#236): one-shot, never started by `make up` ----
  # `make field-keys STEP=backfill|rotate|rewrap|purge` runs one step, as the chart's CronJob does. It acts
  # as the API (its login role), the only workload that may unwrap a field data key.
  field-keys:
    <<: [*hardening, *api-image]
    profiles: [jobs]
    restart: "no"
    entrypoint: ["python", "-m", "sft.workers.field_keys"]
    command: ["backfill"]
    healthcheck: { disable: true }
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local
      DATABASE_URL: postgresql://sft_api:test-only-password@postgres:5432/sft
      FIELDS_KMS_KEY_ID: local
    depends_on:
      <<: *database-ready

  # ---- Database jobs: one-shot, in order, on every `make up`. Each is safe to repeat. ----

  db-bootstrap: # the roles (sft.data.bootstrap), as the superuser; the master user in AWS
    <<: [*hardening, *api-image]
    restart: "no"
    command: ["python", "-m", "sft.data.bootstrap"]
    healthcheck: { disable: true } # the image's check is the API's probe port
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_DATABASE_URL: postgresql://sft:sft-local-only@postgres:5432/sft
      BOOTSTRAP_IAM_AUTH: "false" # AWS signs in with IAM tokens; locally db-passwords sets passwords
    depends_on:
      postgres: { condition: service_healthy }

  db-passwords: # local only: the login roles' fake password; in AWS they have none (IAM tokens)
    <<: *hardening
    image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    user: "999:999"
    restart: "no"
    entrypoint: ["psql", "--no-psqlrc", "--quiet", "--set=ON_ERROR_STOP=1", "--file=/passwords.sql"]
    environment:
      PGHOST: postgres
      PGUSER: sft
      PGPASSWORD: sft-local-only
      PGDATABASE: sft
    volumes: ["./local/postgres/passwords.sql:/passwords.sql:ro"]
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }

  db-migrate: # the migrations (sft.data.migrate), as sft_migrate; an Argo CD PreSync job in AWS
    <<: [*hardening, *api-image]
    restart: "no"
    command: ["python", "-m", "sft.data.migrate"]
    healthcheck: { disable: true } # the image's check is the API's probe port
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATION_DATABASE_URL: postgresql://sft_migrate:test-only-password@postgres:5432/sft
    depends_on:
      db-passwords: { condition: service_completed_successfully }

  relay: # the outbox relay (ADR-0013): the same image, another entry point
    <<: *hardening
    build:
      context: ./services/api
      args: { APP_VERSION: local }
    command: ["python", "-m", "sft.workers.relay"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Its own login role, which reads and marks outbox rows in system scope only (ADR-0020), with the
      # local-only password db-passwords gives every login role, as for the API and the scan workers.
      DATABASE_URL: postgresql://sft_relay:test-only-password@postgres:5432/sft
      # ElasticMQ stands in for SQS; its queues are sft-local-scan-small, -scan-large and -notify.
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://sqs:9324}
      SQS_QUEUE_PREFIX: sft-local-
      # ElasticMQ checks no credentials, but the SDK wants some: obviously fake, local only.
      AWS_ACCESS_KEY_ID: local-fake
      AWS_SECRET_ACCESS_KEY: local-fake
    # 8001 inside: /healthz, /readyz and /metrics. A worker has no other port.
    ports: ["127.0.0.1:8011:8001"]
    stop_grace_period: 25s # more than the 15 s drain
    # Like every workload, it starts once the database is bootstrapped, has its passwords and is migrated.
    depends_on:
      <<: *database-ready
      sqs: { condition: service_healthy }

  # ---- Local stack: AWS stand-ins, pinned by version and digest. Ports bind to 127.0.0.1 only. ----

  postgres: # Aurora PostgreSQL 17 (ADR-0011)
    <<: *hardening
    image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    user: "999:999" # postgres; the entrypoint needs no root, so no capabilities either
    environment:
      POSTGRES_DB: sft
      POSTGRES_USER: sft
      POSTGRES_PASSWORD: sft-local-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    tmpfs: [/tmp, /var/run/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=sft", "--dbname=sft"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

  s3: # S3 (ADR-0012): Adobe S3Mock. Buckets come from s3-init.
    <<: *hardening
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-1
      # The only SSE-KMS keys it accepts, like the bucket policy that refuses other keys: files, then audit.
      # Listed as ARNs; requests must name the bare key ID (S3_FILES_KMS_KEY_ID), which S3Mock checks against them.
      COM_ADOBE_TESTING_S3MOCK_STORE_VALID_KMS_KEYS: >-
        arn:aws:kms:ap-northeast-1:000000000000:key/00000000-0000-4000-8000-000000000001,arn:aws:kms:ap-northeast-1:000000000000:key/00000000-0000-4000-8000-000000000002
    volumes: [s3-data:/s3mockroot]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/favicon.ico"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

  s3-init: # one-shot: creates the buckets of ADR-0012 with versioning, then exits
    <<: *hardening
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: "no"
    entrypoint: ["/bin/sh", "/s3-init.sh"]
    volumes: ["./local/s3/init.sh:/s3-init.sh:ro"]
    depends_on:
      s3: { condition: service_healthy }

  sqs: # SQS (ADR-0013): ElasticMQ, queues from its config file
    <<: *hardening
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    user: "65534:65534" # nobody: the image defaults to root and needs nothing it gives
    volumes: ["./local/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro"]
    tmpfs: [/tmp, /data] # queues live in memory; this keeps the image's /data volume from piling up on each run
    ports: ["127.0.0.1:9324:9324"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  valkey: # ElastiCache Serverless for Valkey (ADR-0014): counters only, nothing persisted
    <<: *hardening
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    user: "999:1000" # valkey
    # One ACL user with a password stands in for the workload's IAM user and token; the default user is off.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --user
      - default
      - "off"
      - --user
      - sft-local
      - "on"
      - ">local-only-valkey-password"
      - "~*"
      - "&*"
      - "+@all"
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --user sft-local --pass local-only-valkey-password --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  mail: # SES (ADR-0015): Mailpit catches everything sent to it; nothing leaves the laptop
    <<: *hardening
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    user: "65534:65534" # nobody: the image defaults to root
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_DISABLE_RDNS: "true" # a slow reverse lookup of the client can outlast the sender's 5 s timeout
      MP_MAX_MESSAGES: "5000"
      MP_ALLOWED_HOSTS: localhost:8025,127.0.0.1:8025,mail:8025 # refuse other Host headers (DNS rebinding)
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"] # SMTP; web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  clamd: # ClamAV clamd in its own container (ADR-0019)
    <<: *hardening
    image: clamav/clamav:1.5.4-debian@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    user: "1000:1000" # clamav
    entrypoint: ["/init-unprivileged"]
    environment:
      # Signatures are the ones baked into the pinned image: no update traffic, the same results on every machine.
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes: ["./local/clamav/clamd.conf:/etc/clamav/clamd.conf:ro"]
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

  oidc: # Cognito user pool (ADR-0016): Keycloak with the sft realm, its app client and a test member
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    # start-dev rebuilds Keycloak into /opt/keycloak/lib at startup, so its root file system can't be read-only.
    read_only: false
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-admin
      KC_HOSTNAME: http://localhost:8180 # the issuer, the same for the browser and for containers
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    # The pool's realm, and a customer's own identity provider that it brokers for tenant SSO (#231).
    volumes:
      - "./local/keycloak/sft-realm.json:/opt/keycloak/data/import/sft-realm.json:ro"
      - "./local/keycloak/customer-realm.json:/opt/keycloak/data/import/customer-realm.json:ro"
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      # The image has no curl or wget; ask the management port's readiness check over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

networks:
  default: {}
  inspection: # the DLP inspector's: no route out (ADR-0022)
    internal: true

volumes:
  postgres-data:
  s3-data:
