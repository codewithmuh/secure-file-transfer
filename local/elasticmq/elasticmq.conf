# ElasticMQ, the local stand-in for SQS (ADR-0013). Local only: in-memory, no authentication.
# Every queue is a standard queue with its own dead-letter queue: 20-second long polling and 5 receives before a
# message moves to the dead-letter queue. The visibility timeouts are starting points; the worker that owns a queue
# sets the final value, here and in Terraform.
include classpath("application.conf")

# "*" builds queue URLs from the request's host, so they work from the host and from other containers.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

aws {
  region = ap-northeast-1
  accountId = "000000000000"
}

queues {
  # Work queues, fed only by the outbox relay. The scan queues are fair queues in AWS: send the tenant ID as
  # MessageGroupId. ElasticMQ accepts and returns it but doesn't schedule fairly.
  sft-local-scan-small {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-scan-small-dlq", maxReceiveCount = 5 }
  }
  sft-local-scan-large {
    # A 2 GB scan takes about 2 minutes; the worker extends the timeout as a heartbeat while it runs.
    defaultVisibilityTimeout = 180 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-scan-large-dlq", maxReceiveCount = 5 }
  }
  sft-local-notify {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-notify-dlq", maxReceiveCount = 5 }
  }

  # Intake queues, one sender each in AWS: the sign-in triggers, the SES events topic, and EventBridge for GuardDuty
  # results and SES tenant status. Locally, tests send these events themselves.
  sft-local-signin-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-signin-events-dlq", maxReceiveCount = 5 }
  }
  sft-local-ses-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-ses-events-dlq", maxReceiveCount = 5 }
  }
  sft-local-guardduty-results {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-guardduty-results-dlq", maxReceiveCount = 5 }
  }
  sft-local-ses-tenant-status {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "sft-local-ses-tenant-status-dlq", maxReceiveCount = 5 }
  }

  sft-local-scan-small-dlq { }
  sft-local-scan-large-dlq { }
  sft-local-notify-dlq { }
  sft-local-signin-events-dlq { }
  sft-local-ses-events-dlq { }
  sft-local-guardduty-results-dlq { }
  sft-local-ses-tenant-status-dlq { }
}
