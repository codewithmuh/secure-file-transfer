# clamd for the local stack (ADR-0019). It runs as the unprivileged clamav user on a read-only root file system;
# /tmp is a tmpfs. The scan worker streams bytes to it with INSTREAM on port 3310.
Foreground yes
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310

# INSTREAM writes the stream here before scanning. Locally that is memory (tmpfs); in EKS it is 4 GiB of disk scratch.
TemporaryDirectory /tmp

# Size limits (abuse and rate limits 6.4): ClamAV scans files up to 2,000,000,000 bytes; larger files go to GuardDuty.
# 2000M is 2,097,152,000 bytes, so every file on our side of the boundary fits.
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 4000M

# A limit is never a pass: report exceeded limits and encrypted content as detections (Heuristics.Limits.Exceeded.*
# and Heuristics.Encrypted.*), which the scan worker maps to "unscannable" (sft.workers.clamd).
AlertExceedsMax yes
AlertEncrypted yes

# Zip bombs (abuse and rate limits 6.4), set and tested by the scan worker (#175, tests/test_scan_engines.py):
# archives nested more than 10 deep, more than 10,000 files in one scan, or a scan over 5 minutes are limit alerts.
# ClamAV has no compression-ratio setting: a ratio bomb stops at MaxFileSize (one member's extracted bytes) or
# MaxScanSize (the scan's), as a limit alert too. The worker's own timeout for a file grows with its size and is
# longer than MaxScanTime for the largest files (sft.service.scan_timing).
MaxRecursion 10
MaxFiles 10000
MaxScanTime 300000
