# Weekly, grouped updates so dependency PRs stay reviewable. Pinned action SHAs are updated too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      actions: { patterns: ["*"] }

  # The AWS provider in every Terraform root, with its lock file (ADR-0005). One pull request per provider release
  # for all roots, so they never drift apart. Modules set only a minimum version and aren't listed.
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap/*/*
      - /infra/environments/*/*/*
      - /infra/environments/prod/retained
      - /infra/organization
      - /infra/shared
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      terraform-providers:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      python: { patterns: ["*"] }
    ignore:
      # SQLAlchemy stays on 2.0 (ADR-0002): 2.1 is a deliberate upgrade, not a Dependabot bump. See the note on its pin
      # in services/api/pyproject.toml. Patch releases of 2.0 still come through.
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Minor and patch updates in one weekly pull request; each major update gets its own, since it may need code changes.
  # The Node version in web/.nvmrc isn't covered: bump it by hand to the current LTS release.
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      web: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/services/api]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: docker-compose # the local stack's images, pinned by version and digest in compose.yaml
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      local-stack: { patterns: ["*"] }
