# Weekly, grouped updates so dependency PRs stay reviewable. Pinned action SHAs are updated too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/services/api]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: docker-compose # the local stack's images, pinned by version and digest in compose.yaml
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # wait a week before proposing a brand-new release (threat model T-68)
    groups:
      local-stack: { patterns: ["*"] }
