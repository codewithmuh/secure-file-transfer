name: promote

# Promotion to staging and prod, and the gate on every promotion (ADR-0005, architecture 3.3, #107).
#
# - `open` (run by hand from main): copies the previous environment's digest into the next one, dev → staging or
#   staging → prod, and opens the promotion pull request as the bot, so CI runs on it. It only proposes: the pull
#   request deploys when it merges, and merging the prod pull request is prod's approval.
# - `promotion-gate` (every pull request, a required check): passes a pull request that doesn't change staging's or
#   prod's digest. One that does passes only if it changes no other environment's digest and either copies the digest
#   the previous environment pins on main, with that environment synced, healthy and probed on it, or restores a digest
#   the environment ran before on main (a revert, which passes at once so a rollback merges within NFR-18's 10
#   minutes). It reads the pull request's own head commit, so a re-run re-checks the same proposal, and runs the
#   gate script from the base commit, so a pull request can't change how its own gate decides (#132).
#
# Nothing here runs on a push, so a promotion merge starts no build or promotion; build.yml ignores it too. The merge
# runs only mark-deployed.yml, which tags what main now pins deployed and changes nothing in Git.
#
# Variables: see build.yml (ECR_REGISTRY, ECR_PUSH_ROLE_ARN, BOT_APP_CLIENT_ID; secret BOT_APP_PRIVATE_KEY).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote to (it copies the one before it)
        type: choice
        options: [staging, prod]
        required: true
  pull_request:

permissions: {}

concurrency:
  group: promote-${{ github.event_name == 'pull_request' && github.ref || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  open:
    name: Open the ${{ inputs.environment }} promotion pull request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 10
    environment: registry # the push role, to tag the digest deployed; main only (T-71)
    permissions:
      contents: read
      id-token: write # OIDC into the push role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the previous environment's digest
        id: copy
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case $TARGET in
            staging) from=dev ;;
            prod) from=staging ;;
            *) echo "::error::unknown environment $TARGET"; exit 1 ;;
          esac
          digest=$(.github/scripts/promotion.sh copy "$from" "$TARGET")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          role-session-name: promote-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ap-northeast-1
      # The digest has landed on main in the previous environment, and mark-deployed.yml tagged it then: normally a
      # no-op that finds the Git SHA it was built from. It fails for a digest that isn't a build from main.
      - name: Tag the digest deployed
        id: tag
        env:
          DIGEST: ${{ steps.copy.outputs.digest }}
        run: |
          sha=$(.github/scripts/promotion.sh mark-deployed "$DIGEST")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          TARGET: ${{ inputs.environment }}
          DIGEST: ${{ steps.copy.outputs.digest }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: .github/scripts/promotion.sh open-pr "$TARGET" "$DIGEST" "$SHA"

  # Required by name on main (#59), so it runs on every pull request and passes when there is nothing to check.
  promotion-gate:
    name: promotion-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 35 # the health checks wait up to 30 minutes (ADR-0005)
    permissions:
      contents: read
      id-token: write # OIDC into the previous environment's plan role, to read the probe's result (T-71)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }} # the head commit, not the merge commit
          fetch-depth: 0 # each environment's history on the base branch, for reverts
          persist-credentials: false
      - name: What the pull request changes in the deploy config
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The gate's own logic comes from the base commit, never from the pull request it judges: a pull
          # request can't change how its own gate decides, and a branch made before the script existed still
          # gets checked (#132). Only the deploy config is read from the head.
          gate="$RUNNER_TEMP/promotion.sh"
          git show "$BASE:.github/scripts/promotion.sh" > "$gate"
          chmod +x "$gate"
          decisions=$("$gate" gate "$BASE" "$HEAD")
          promotions=""
          {
            echo "### promotion-gate"
            if [[ -z $decisions ]]; then echo "No environment's digest changes: nothing to check."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r env mode prev digest; do
            [[ -z $env ]] && continue
            case $mode in
              # Nothing a pull request can assume reads ECR yet, so whether the digest is there and signed isn't
              # checked here: admission refuses an unsigned one, and mark-deployed.yml fails on the merge of one that
              # isn't a build from main (ADR-0007).
              build) echo "- $env: a new digest; not yet checked against ECR before merge (ADR-0007)." >> "$GITHUB_STEP_SUMMARY" ;;
              rollback) echo "- $env: restores a digest it ran before (a revert): passes at once." >> "$GITHUB_STEP_SUMMARY" ;;
              promote)
                echo "- $env: copies $prev's \`$digest\`; $prev must be synced, healthy and probed on it." >> "$GITHUB_STEP_SUMMARY"
                promotions+="$env:$prev:$digest "
                ;;
            esac
          done <<< "$decisions"
          echo "promotions=${promotions% }" >> "$GITHUB_OUTPUT"

      # TODO(ADR-0005, needs AWS): read the previous environment's Argo CD state from the GitHub deployment statuses
      # that Argo CD notifications post per environment and region (#104), and pass when every application is Synced
      # and Healthy on the digest; poll for up to 30 minutes. Needs `deployments: read`. Until then a promotion to
      # staging or prod fails here: neither exists yet, and a gate that passes unchecked would be worse than none.
      - name: Previous environment synced and healthy in Argo CD
        if: steps.gate.outputs.promotions != ''
        env:
          PROMOTIONS: ${{ steps.gate.outputs.promotions }}
        run: |
          for p in $PROMOTIONS; do
            IFS=: read -r env prev digest <<< "$p"
            echo "::error::promotion-gate can't yet read $prev's Argo CD health on $digest (TODO, ADR-0005); $env not promoted."
          done
          exit 1

      # The synthetic probe (#248) runs the send, verify and download journey every 5 minutes in each environment and
      # writes SecureFileTransfer/Probe ProbeSuccess to CloudWatch in Tokyo, by Environment and by Environment and
      # ImageDigest (the digest its pod runs): 1 for a run that passed, 0 for one that failed. The gate reads it as the previous environment's plan role, which trusts pull
      # requests from this repository only and reads, never changes (T-71); its ARN is the repository variable
      # TF_PLAN_ROLE_ARN_DEV or TF_PLAN_ROLE_ARN_STAGING (docs/runbooks/apply-staging-and-prod.md).
      #
      # The gate reads the series of the digest it promotes, counting only runs since the digest landed in that
      # environment's deploy config on main and in the last 20 minutes, so an old pass never counts. It passes when
      # the three most recent periods (15 minutes) all passed. It waits up to 30 minutes for that (ADR-0005), and
      # fails closed: no data, a failed run among the last three, or no role, and the promotion waits.
      - name: Which environment to read
        id: prev
        if: ${{ !cancelled() && steps.gate.outputs.promotions != '' }}
        env:
          PROMOTIONS: ${{ steps.gate.outputs.promotions }}
        run: |
          # promotion.sh refuses a pull request that changes more than one environment's digest, so there is one.
          read -r first rest <<< "$PROMOTIONS"
          if [[ -n $rest ]]; then echo "::error::one promotion per pull request"; exit 1; fi
          IFS=: read -r env prev digest <<< "$first"
          {
            echo "env=$env"
            echo "prev=$prev"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ !cancelled() && steps.prev.outputs.prev != '' }}
        with:
          role-to-assume: ${{ steps.prev.outputs.prev == 'dev' && vars.TF_PLAN_ROLE_ARN_DEV || vars.TF_PLAN_ROLE_ARN_STAGING }}
          role-session-name: promotion-gate-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ap-northeast-1
      - name: Previous environment probed on the digest
        if: ${{ !cancelled() && steps.prev.outputs.prev != '' }}
        env:
          ENV: ${{ steps.prev.outputs.env }}
          PREV: ${{ steps.prev.outputs.prev }}
          DIGEST: ${{ steps.prev.outputs.digest }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # When the digest landed in the previous environment's deploy config on main: its oldest commit there.
          landed=$(git log --format=%ct --reverse -S"$DIGEST" "$BASE" -- "deploy/environments/$PREV/ap-northeast-1/values.yaml" | head -n 1)
          if [[ -z $landed ]]; then
            echo "::error::$DIGEST never landed in $PREV on main; $ENV not promoted."
            exit 1
          fi
          query='[{"Id":"probe","MetricStat":{"Metric":{"Namespace":"SecureFileTransfer/Probe","MetricName":"ProbeSuccess","Dimensions":[{"Name":"Environment","Value":"'"$PREV"'"},{"Name":"ImageDigest","Value":"'"$DIGEST"'"}]},"Period":300,"Stat":"Minimum"}}]'
          for attempt in $(seq 1 30); do
            recent=$(( $(date -u +%s) - 1200 ))
            start=$(date -u -d "@$(( landed > recent ? landed : recent ))" +%Y-%m-%dT%H:%M:%SZ)
            # Newest first; a period's minimum is 0 if any run in it failed.
            values=$(aws cloudwatch get-metric-data --metric-data-queries "$query" \
              --start-time "$start" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --scan-by TimestampDescending \
              --query 'MetricDataResults[0].Values' --output json)
            runs=$(jq length <<< "$values")
            last=$(jq -c '.[:3]' <<< "$values")
            echo "attempt $attempt: $runs probe periods since $start; newest three: $last"
            if (( runs >= 3 )) && [[ $(jq '.[:3] | all(. == 1)' <<< "$values") == true ]]; then
              echo "- $PREV: the synthetic probe passed its last three runs on \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 60
          done
          echo "::error::$PREV's synthetic probe hasn't passed three runs in a row on $DIGEST within 30 minutes; $ENV not promoted."
          exit 1
