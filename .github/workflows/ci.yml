name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-checks:
    name: Repo checks (workflows, secrets, misconfigurations)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets in older commits are found too
          persist-credentials: false
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Lint the OpenAPI contract (rules in redocly.yaml)
        uses: docker://redocly/cli:2.64.1
        env:
          REDOCLY_TELEMETRY: "off"
        with:
          args: lint docs/api/openapi.yaml
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  local-stack:
    name: Local stack (up, smoke checks)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: local/smoke.py
      - name: Start the API and the local stack, wait until every service is healthy
        run: make up
      - name: Smoke checks (one round trip per service)
        run: make smoke
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the stack and its volumes
        if: always()
        run: make reset

  python:
    name: Python (lint, types, layers, tests)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
      - run: uv run lint-imports # the layers of ADR-0002 (see pyproject.toml)
      - run: uv run pytest # fails below 80% coverage (see pyproject.toml)

  # Always runs and reports, so it can be a required check (#59). A pull request that changes nothing under
  # web/ and not this workflow skips the steps, and the job still passes; a job-level `if:` would report "skipped".
  web:
    name: Web app (types, lint, tests, build)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents, to see what it changes
          persist-credentials: false
      - name: Check whether the web app changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A push to main always runs everything. On a pull request, HEAD is the merge commit and
          # HEAD^1 the tip of the base branch. If git fails, the step fails, so nothing is skipped silently.
          if [[ "$EVENT" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep --quiet --extended-regexp '^(web/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under web/ or in ci.yml changed: the web checks were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts # no install scripts in CI (threat model T-68)
      - if: steps.changes.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint
      - if: steps.changes.outputs.run == 'true'
        run: npm test
      - if: steps.changes.outputs.run == 'true'
        run: npm run build # the production bundle (ADR-0008)

  images:
    name: Image ${{ matrix.service }} (build, scan, smoke test)
    needs: [python]
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    strategy:
      fail-fast: false
      # One image today; the matrix stays for the web app image in M3.
      matrix:
        include:
          - service: api
            port: 8000 # the API
            internal_port: 8001 # /healthz, /readyz and /metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (read-only, no capabilities; probes, metrics, graceful shutdown)
        env:
          IMAGE: ${{ matrix.service }}:ci
          PORT: ${{ matrix.port }}
          INTERNAL_PORT: ${{ matrix.internal_port }}
        run: |
          docker run --detach --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish "127.0.0.1:9000:${PORT}" --publish "127.0.0.1:9001:${INTERNAL_PORT}" "$IMAGE"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9001/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9001/healthz
          curl --fail --silent --show-error http://127.0.0.1:9001/readyz
          curl --fail --silent --show-error http://127.0.0.1:9001/metrics | grep --quiet '^# TYPE http_requests_total counter'
          # The public port serves only the API: probes and metrics aren't there.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/metrics)" = 404
          # SIGTERM: fail readiness, drain, exit 0. docker stop sends SIGKILL (exit 137) after 30 s.
          docker stop --time 30 smoke
          docker logs smoke | tail -n 8
          test "$(docker inspect --format '{{.State.ExitCode}}' smoke)" = 0
