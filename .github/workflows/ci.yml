name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request can affect (#297): the Python suite and the local stack take 20 to 30 minutes, so a pull
  # request that changes only what neither reads (infra/, ops/, deploy/, most docs, other workflows) skips them. Only
  # paths known to be irrelevant skip anything; a push to main runs everything, and so does a failure here.
  changes:
    name: What the change can affect
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 5
    outputs:
      python: ${{ steps.changes.outputs.python }}
      stack: ${{ steps.changes.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the pull request's base
          persist-credentials: false
      - name: The Python suite and the local stack, each affected or not
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          .github/scripts/ci-changes.sh --test
          .github/scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  repo-checks:
    name: Repo checks (workflows, secrets, misconfigurations)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets in older commits are found too
          persist-credentials: false
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Lint the OpenAPI contract (rules in redocly.yaml)
        uses: docker://redocly/cli:2.64.1
        env:
          REDOCLY_TELEMETRY: "off"
        with:
          args: lint docs/api/openapi.yaml
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The reviewed, path-scoped exceptions (each with its reason), the same file `make infra-check` reads.
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Dry-run the promotion scripts and build.yml's trigger filters (#107)
        if: ${{ !cancelled() }}
        run: .github/scripts/test-promotion.sh
      - name: Dry-run the web release script and its workflows' triggers (#283)
        if: ${{ !cancelled() }}
        run: .github/scripts/test-web-release.sh
      - name: Shellcheck the release and tunnel scripts (.github/scripts, #279, #283)
        if: ${{ !cancelled() }}
        run: shellcheck -x .github/scripts/web-release.sh .github/scripts/test-web-release.sh .github/scripts/cluster-tunnel.sh .github/scripts/ci-changes.sh # the runner's shellcheck
      - name: Check the ruleset's required checks are jobs that report on every PR (#59)
        if: ${{ !cancelled() }}
        run: .github/scripts/check-ruleset.sh
      - name: Dry-run the drill and teardown scripts, with no AWS (ops/test.sh, #252 to #254)
        if: ${{ !cancelled() }}
        run: ops/test.sh
      - name: Shellcheck the drill and teardown scripts (ops/)
        if: ${{ !cancelled() }}
        run: shellcheck -x ops/*.sh ops/lib/*.sh # the runner's shellcheck

  local-stack:
    # Also the journeys: M2's (#182) and M5's (#223) through the API, M3's (#200) and M5's in the browser, each the
    # whole journey on this stack, every pull request, so all are required through this job's existing check (no
    # ruleset change). The name stays: the ruleset names it.
    name: Local stack (up, smoke checks)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 90
    needs: changes
    # Skipped only when `changes` says nothing here can be affected; a skipped job's check counts as passed (#297).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.stack != 'false') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            local/smoke.py
            local/seed.py
            services/api/uv.lock
      - name: Start the API and the local stack, wait until every service is healthy
        run: make up
      - name: Smoke checks (one round trip per service)
        run: make smoke
      - name: Seed the local stack (a tenant, an admin, a member and an approver, #182, #223)
        run: make seed
      # M2's steps 1 to 9, the synthetic probe, then M5's upload request, three DLP outcomes, API key and audit
      # export, which waits about five minutes for the upload request's notices.
      - name: The M2 and M5 journeys through the API (#182, #223)
        timeout-minutes: 20
        run: make e2e
      # The web app's browser flows against the same stack (#195 to #199), the M3 and M5 journeys in English and
      # Japanese (#200, #223) and the NFR-3 upload resume (#267): sign-in, uploads, scan and DLP status, admin pages,
      # the recipient's and the uploader's link pages, delivery, unlock, revoke, expiry, DLP approvals with a step-up,
      # audit search and export. Chromium in the pinned Playwright image, on the host's network, so the browser sees
      # http://localhost:3000 as a person does (Makefile, web-e2e).
      - name: Web app browser flows and the M3 and M5 journeys (#195 to #200, #223, #267)
        timeout-minutes: 50
        run: make web-e2e
      # On failure, each service's log as a file (the step's own output stays short) and the failed browser step's
      # traces, screenshots and axe findings (web/test-results, from make web-e2e), kept 7 days.
      - name: Save the stack's logs
        if: failure()
        run: |
          mkdir -p stack-logs
          docker compose ps --all > stack-logs/ps.txt
          for service in $(docker compose config --services); do
            docker compose logs --no-color --timestamps "$service" > "stack-logs/$service.log" 2>&1 || true
          done
          docker compose logs --no-color --tail 200
      - name: Keep the stack's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-stack-logs
          path: stack-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the browser flows' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the stack and its volumes
        if: always()
        run: make reset

  # The suite in six parallel shards, each with its own services (.github/scripts/pytest-shard.py splits the test
  # files); `python` below combines their coverage and is the required check.
  python-tests:
    name: Python tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: services/api
    # Real PostgreSQL for the data layer's tests, at ADR-0011's major version. The tests make their
    # own databases on it and drop them. Password auth, as in every real environment, so logins are
    # tested too; the password is made per run from the run's ID, so no literal sits in the workflow.
    # (The services block can't read the env context, so the expression appears twice.)
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --host 127.0.0.1"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # ElasticMQ, the local SQS (as in compose.yaml), for the SQS adapter's integration tests and
      # the relay's entry point. It takes no credentials; the tests make their own queues and delete them.
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
        ports: ["9324:9324"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:9324/health"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Real Valkey for the rate-limit counters (ADR-0014), at the local stack's version and digest. A
      # password per run as above; the image's entrypoint appends VALKEY_EXTRA_FLAGS.
      valkey:
        image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        env:
          VALKEY_EXTRA_FLAGS: --save '' --appendonly no --requirepass vk-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli -a vk-${{ github.run_id }}-${{ github.run_attempt }} --no-auth-warning ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # S3Mock, the local S3 (as in compose.yaml), for the S3 adapter and the upload path (#114). It
      # takes no credentials and accepts only the files key; the tests make their own buckets.
      s3mock:
        image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-1
          COM_ADOBE_TESTING_S3MOCK_STORE_VALID_KMS_KEYS: arn:aws:kms:ap-northeast-1:000000000000:key/00000000-0000-4000-8000-000000000001
        ports: ["9090:9090"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:9090/favicon.ico"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      TEST_DATABASE_URL: postgresql://postgres:pg-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/postgres
      TEST_SQS_ENDPOINT_URL: http://127.0.0.1:9324
      TEST_VALKEY_URL: redis://:vk-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:6379/0
      TEST_S3_ENDPOINT_URL: http://127.0.0.1:9090
      # clamd as the local stack runs it, with its zip-bomb limits, for the scan worker's engine tests (#175).
      TEST_CLAMD_URL: tcp://127.0.0.1:3310
      CI_SCAN_ENGINES: "1" # fail, rather than skip, if TEST_CLAMD_URL goes missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not a service container: it needs the repository's clamd.conf. It loads its signatures while the steps below
      # run, and the tests wait for it.
      - name: Start clamd with the local stack's configuration (compose.yaml's image)
        working-directory: .
        run: >-
          docker run --detach --name clamd --user 1000:1000 --read-only --tmpfs /tmp --tmpfs /run/clamav
          --cap-drop ALL --security-opt no-new-privileges --entrypoint /init-unprivileged
          --env CLAMAV_NO_FRESHCLAMD=true --publish 127.0.0.1:3310:3310
          --volume "$PWD/local/clamav/clamd.conf:/etc/clamav/clamd.conf:ro"
          clamav/clamav:1.5.4-debian@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - name: Lint, types and layers (shard 1 only)
        if: matrix.shard == 1
        run: |
          uv run ruff format --check .
          uv run ruff check --output-format=github .
          uv run mypy
          uv run lint-imports # the layers of ADR-0002 (see pyproject.toml)
      - name: Wait for clamd's signatures
        run: timeout 300 sh -c 'until docker exec clamd clamdcheck.sh >/dev/null 2>&1; do sleep 3; done'
      - name: This shard's tests, against the PostgreSQL, ElasticMQ, Valkey, S3Mock and clamd services
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage/.coverage.shard-${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          # shellcheck disable=SC2046 # one word per test file
          uv run pytest --cov-fail-under=0 --cov-report= $(python3 ../../.github/scripts/pytest-shard.py ${{ matrix.shard }} 6)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python:
    name: Python (lint, types, layers, tests)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    needs: [changes, python-tests]
    # Always runs: a job skipped because a shard failed would count as passing for the required check.
    if: always()
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Every shard passed, or nothing in the change can affect them (#297)
        id: shards
        working-directory: .
        env:
          SHARDS: ${{ needs.python-tests.result }}
          CHANGES: ${{ needs.changes.result }}
          AFFECTED: ${{ needs.changes.outputs.python }}
        run: |
          if [[ $CHANGES == success && $AFFECTED == false ]]; then
            echo "Nothing in this change can affect the Python suite, so its shards were skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$SHARDS" = success || { echo "::error::A test shard didn't pass ($SHARDS)."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.shards.outputs.skipped != 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.shards.outputs.skipped != 'true'
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
        if: steps.shards.outputs.skipped != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.shards.outputs.skipped != 'true'
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true
      - name: Combined coverage of every shard; fails below 80 %
        if: steps.shards.outputs.skipped != 'true'
        run: |
          uv run coverage combine "$RUNNER_TEMP"/coverage/.coverage.shard-*
          uv run coverage report --show-missing --skip-covered --fail-under=80

  mail:
    name: Mail adapter (SMTP to Mailpit)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    defaults:
      run:
        working-directory: services/api
    services:
      mailpit:
        image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_MAIL_CATCHER_URL: http://127.0.0.1:8025
      TEST_SMTP_PORT: "1025"
      MAIL_TESTS_REQUIRED: "1" # fail, rather than skip, if the variables above go missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      # Only the integration test, so the coverage gate (which the python job applies) is off here.
      - run: uv run pytest --no-cov tests/test_mail_mailpit.py

  # Always runs and reports, so it can be a required check (#59). A pull request that changes nothing under web/,
  # not the API contract (the source of the web app's generated client) and not this workflow skips the steps, and
  # the job still passes; a job-level `if:` would report "skipped".
  web:
    name: Web app (types, lint, tests, build)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents, to see what it changes
          persist-credentials: false
      - name: Check whether the web app changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A push to main always runs everything. On a pull request, HEAD is the merge commit and
          # HEAD^1 the tip of the base branch. If git fails, the step fails, so nothing is skipped silently.
          if [[ "$EVENT" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep --quiet --extended-regexp '^(web/|docs/api/openapi\.yaml$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under web/, in the API contract or in ci.yml changed: the web checks were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts # no install scripts in CI (threat model T-68)
      - if: steps.changes.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint
      - if: steps.changes.outputs.run == 'true'
        run: npm test
      - if: steps.changes.outputs.run == 'true'
        run: npm run build # the production bundle (ADR-0008)
      - name: Check the generated API client matches the contract
        if: steps.changes.outputs.run == 'true'
        run: |
          # FR-31: src/api/schema.ts is generated from docs/api/openapi.yaml. Regenerate it; any change fails.
          npm run gen:api
          if [[ -n "$(git status --porcelain -- src/api)" ]]; then
            git --no-pager diff --stat -- src/api
            echo "::error file=web/src/api/schema.ts::The generated API client is out of date with docs/api/openapi.yaml. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          fi

  # axe on every page of the built app, in English and Japanese (NFR-22, FR-33, #110). Any WCAG A or AA violation fails
  # the job. `make web-a11y` runs install, build, `vite preview` and Chromium in the Playwright image pinned in the
  # Makefile, as it does locally. Skips its steps like the web job above, so it can be a required check (protect-main).
  web-a11y:
    name: Web app (accessibility, English and Japanese)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents, to see what it changes
          persist-credentials: false
      - name: Check whether the web app changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # As in the web job: a push to main always runs, and a failing git fails the step.
          if [[ "$EVENT" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep --quiet --extended-regexp '^(web/|Makefile$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under web/, in the Makefile or in ci.yml changed: the accessibility checks were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: axe checks on every page (Playwright image, vite preview, mock data)
        if: steps.changes.outputs.run == 'true'
        run: make web-a11y

  images:
    name: Image ${{ matrix.service }} (build, scan, smoke test)
    needs: [python]
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    strategy:
      fail-fast: false
      # One image today; the matrix stays for the web app image in M3.
      matrix:
        include:
          - service: api
            port: 8000 # the API
            internal_port: 8001 # /healthz, /readyz and /metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (read-only, no capabilities; probes, metrics, graceful shutdown)
        env:
          IMAGE: ${{ matrix.service }}:ci
          PORT: ${{ matrix.port }}
          INTERNAL_PORT: ${{ matrix.internal_port }}
        run: |
          # The API needs DATABASE_URL, VALKEY_URL, the sign-in settings, the files buckets and the audit
          # archive to start, but connects to each only when a request needs it, so nothing has to listen on
          # these addresses. Every value is an obviously fake one for CI; the CSRF key is 32 bytes of "x",
          # the email one of "y", the code one of "z". Outside local and test the API needs its trusted
          # proxies (#129); the smoke test runs as prod would.
          docker run --detach --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --env DATABASE_URL=postgresql://sft_api@127.0.0.1:1/sft \
            --env VALKEY_URL=redis://u:p@127.0.0.1:1/0 --env WEB_ORIGIN=https://app.sft.test \
            --env OIDC_ISSUER=https://idp.sft.test --env OIDC_CLIENT_ID=sft-api-ci \
            --env OIDC_CLIENT_SECRET=ci-only-fake --env OIDC_PROVIDER_NAME=ci \
            --env OIDC_REDIRECT_URI=https://api.sft.test/v1/auth/callback \
            --env OIDC_LOGOUT_URL=https://idp.sft.test/logout \
            --env 'CSRF_KEYRING=[{"id":"ci","state":"active","key":"eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="}]' \
            --env 'EMAIL_HMAC_KEYRING=[{"id":"ci","state":"active","key":"eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXk=","activated_at":"2026-01-01T00:00:00Z"}]' \
            --env S3_FILES_BUCKET=sft-ci-files --env S3_LARGE_FILES_BUCKET=sft-ci-large-files \
            --env S3_FILES_KMS_KEY_ID=00000000-0000-4000-8000-000000000001 \
            --env FIELDS_KMS_KEY_ID=alias/sft/ci/fields \
            --env AUDIT_ARCHIVE_TOKYO_BUCKET=sft-ci-audit-archive \
            --env API_KEY_ENVIRONMENT=dev \
            --env TRUSTED_PROXIES=10.0.0.0/20 \
            --env 'CODE_HMAC_KEYRING=[{"id":"ci","state":"active","key":"enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno="}]' \
            --publish "127.0.0.1:9000:${PORT}" --publish "127.0.0.1:9001:${INTERNAL_PORT}" "$IMAGE"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9001/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9001/healthz
          curl --fail --silent --show-error http://127.0.0.1:9001/readyz
          curl --fail --silent --show-error http://127.0.0.1:9001/metrics | grep --quiet '^# TYPE http_requests_total counter'
          # The public port serves only the API: probes and metrics aren't there.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/metrics)" = 404
          # SIGTERM: fail readiness, drain, exit 0. docker stop sends SIGKILL (exit 137) after 30 s.
          docker stop --time 30 smoke
          docker logs smoke | tail -n 8
          test "$(docker inspect --format '{{.State.ExitCode}}' smoke)" = 0
      - name: Smoke test the database jobs (the migrations ship in the image and run from empty)
        if: matrix.service == 'api'
        env:
          IMAGE: ${{ matrix.service }}:ci
          PG_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }} # per run, as above
        run: |
          docker network create smoke-db
          docker run --detach --name smoke-postgres --network smoke-db \
            --env POSTGRES_PASSWORD="$PG_PASSWORD" postgres:17.11-trixie
          for _ in $(seq 1 30); do
            if docker exec smoke-postgres pg_isready --host 127.0.0.1 --quiet; then break; fi
            sleep 1
          done
          admin="postgresql://postgres:${PG_PASSWORD}@smoke-postgres:5432/postgres"
          job() { # job MODULE [docker run options]: python -m MODULE in the image, hardened as above
            local module=$1
            shift
            docker run --rm --network smoke-db --read-only --cap-drop ALL \
              --security-opt no-new-privileges "$@" "$IMAGE" python -m "$module"
          }
          job sft.data.bootstrap --env BOOTSTRAP_DATABASE_URL="$admin" --env BOOTSTRAP_IAM_AUTH=false
          # The superuser may become sft_owner too, so no role needs a password here. The second run
          # finds the database at the image's head and does nothing.
          job sft.data.migrate --env MIGRATION_DATABASE_URL="$admin"
          job sft.data.migrate --env MIGRATION_DATABASE_URL="$admin" | grep --quiet '"action": "current"'
      - name: Smoke test the outbox relay (the same image, its own entry point and role)
        if: matrix.service == 'api'
        env:
          IMAGE: ${{ matrix.service }}:ci
          RELAY_PASSWORD: relay-${{ github.run_id }}-${{ github.run_attempt }} # per run, as above
        run: |
          # The relay logs in as sft_relay; bootstrap gave it no password, so give it a throwaway one.
          docker exec smoke-postgres psql --username postgres --quiet \
            --command "ALTER ROLE sft_relay PASSWORD '${RELAY_PASSWORD}'"
          # No topics exist yet, so it sends nothing: SQS can be unreachable, the database can't.
          docker run --detach --name smoke-relay --network smoke-db --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --env DATABASE_URL="postgresql://sft_relay:${RELAY_PASSWORD}@smoke-postgres:5432/postgres" \
            --env SQS_QUEUE_PREFIX=sft-ci- --env SQS_ENDPOINT_URL=http://127.0.0.1:1 \
            --env AWS_ACCESS_KEY_ID=ci-fake --env AWS_SECRET_ACCESS_KEY=ci-fake \
            --publish 127.0.0.1:9011:8001 "$IMAGE" python -m sft.workers.relay
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9011/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9011/healthz
          # It reached the database: its batches ran and none failed.
          for _ in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1:9011/metrics \
              | grep --quiet '^outbox_relay_batch_duration_seconds_count [1-9]'; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9011/metrics \
            | grep --quiet '^outbox_oldest_unpublished_age_seconds 0.0'
          docker stop --time 30 smoke-relay
          docker logs smoke-relay | tail -n 8
          test "$(docker inspect --format '{{.State.ExitCode}}' smoke-relay)" = 0
          if docker logs smoke-relay | grep --quiet 'outbox batch failed'; then exit 1; fi

  # The deploy config of ADR-0005: the chart and the Argo CD Applications under deploy/. It runs on every pull request,
  # promotion pull requests (#107) included, which change only deploy/.
  deploy:
    name: Deploy config (helm lint, template, kubeconform, runtime contract)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 10
    env:
      # Argo CD renders with Helm 3; the checksums are the release's own (get.helm.sh, kubeconform's CHECKSUMS).
      HELM_VERSION: v3.22.0
      HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm and kubeconform, checked against their checksums
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file helm.tar.gz --strip-components 1 --directory bin linux-amd64/helm
          curl --fail --silent --show-error --location --output kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file kubeconform.tar.gz --directory bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Renders every cluster once (#186): the steps below all read this directory, the tests through SFT_RENDERED.
      - name: helm lint and helm template for every cluster, kubeconform on the output, the operator's CRDs
        run: deploy/check.sh "$RUNNER_TEMP/rendered"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Every rendered container meets the runtime contract (architecture 8)
        env:
          SFT_RENDERED: ${{ runner.temp }}/rendered
        run: uv run --project services/api --locked pytest -p no:cacheprovider deploy/tests
      - name: Every rendered pod passes the cluster's admission policies (Kyverno CLI, ADR-0004)
        run: deploy/policies.sh "$RUNNER_TEMP/rendered"
      - name: Scan every cluster's rendered manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/rendered
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: The alert rules pass their unit tests (promtool from the pinned Prometheus image, deploy/alerts)
        run: deploy/alerts/test.sh
      - name: The observability stack, its dashboards and CRDs pass their tests (deploy/observability, #243, #244, #264)
        env:
          SFT_RENDERED: ${{ runner.temp }}/rendered
        run: uv run --project services/api --locked pytest -p no:cacheprovider deploy/observability/tests
