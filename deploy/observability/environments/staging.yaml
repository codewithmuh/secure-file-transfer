# staging's observability stack (capacity 4.3, A28): prod's charts cut down, one of each, 7 days of metrics, Loki and
# Tempo single binary, 100 GB of volumes in all. Every chart reads this file after the cluster's values file; each
# takes only its own keys.

prometheus:
  replicas: 1
  retention: 7d
  storage: 50Gi
  retentionSize: 45GB
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 3Gi }

alertmanager:
  replicas: 1

loki:
  deploymentMode: SingleBinary
  loki:
    limits_config: { retention_period: 336h } # 14 days
  singleBinary:
    replicas: 1
    persistence: { size: 25Gi }

tempo:
  persistence: { size: 25Gi }
  tempo:
    retention: 168h # 7 days

gateway:
  replicas: 1
