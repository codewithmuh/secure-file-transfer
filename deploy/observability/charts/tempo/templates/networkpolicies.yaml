{{- /*
Tempo (ADR-0021): spans in from the gateway collectors only, queries from Grafana, scrapes from Prometheus; out only to
CoreDNS, its credentials and its bucket in S3.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo }
  policyTypes: [Ingress, Egress]
  ingress:
    {{- include "obs.from" (dict "namespace" .Release.Namespace "name" "otel-gateway" "ports" (list 4317)) | nindent 4 }}
    {{- include "obs.from" (dict "namespace" "grafana" "name" "grafana" "ports" (list 3200)) | nindent 4 }}
    {{- include "obs.from" (dict "namespace" .Release.Namespace "name" "prometheus" "ports" (list 3200)) | nindent 4 }}
  egress:
    {{- include "obs.dns" . | nindent 4 }}
    {{- include "obs.podIdentity" . | nindent 4 }}
    {{- include "obs.s3" . | nindent 4 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tempo
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tempo, app.kubernetes.io/instance: {{ .Release.Name }} }
