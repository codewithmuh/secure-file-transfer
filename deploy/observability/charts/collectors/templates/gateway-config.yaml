{{- $g := .Values.gateway }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway
  labels: { app.kubernetes.io/name: otel-gateway, app.kubernetes.io/part-of: sft-observability }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # ADR-0009: keep every trace with an error, every slow one, and a share of the rest, for 14 days in Tempo.
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        policies:
          - name: errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: slow
            type: latency
            latency: { threshold_ms: {{ $g.slowTraceMs }} }
          - name: share
            type: probabilistic
            probabilistic: { sampling_percentage: {{ $g.samplePercent }} }
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: tempo.{{ .Release.Namespace }}.svc.cluster.local:4317
        tls: { insecure: true }
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs: { encoding: json }
        metrics:
          readers:
            - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/tempo]
