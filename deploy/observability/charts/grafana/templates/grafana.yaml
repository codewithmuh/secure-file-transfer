apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sft-observability }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sft-observability }
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sft-observability }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.pools.main | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: {{ required "global.imageRegistry is required" .Values.global.imageRegistry }}/{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}@{{ .Values.grafana.image.digest }}
          env:
            - { name: GF_PATHS_CONFIG, value: /etc/grafana/grafana.ini }
            - { name: SFT_CLUSTER, value: {{ include "grafana.cluster" . }} }
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini, readOnly: true }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: grafana-config } }
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: {} }
---
# Reached by `kubectl -n grafana port-forward svc/grafana 3000`; never a load balancer's (T-05).
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: sft-observability }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
---
# ReadOnly and Operator may port-forward here and nowhere else but sft-operator (authn-authz 8.1, T-63). The role is
# cluster-bootstrap's sft:portforward: get pods and services, create pods/portforward.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sft:portforward
  labels: { app.kubernetes.io/part-of: sft-observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sft:portforward
subjects:
  {{- range .Values.portForwardGroups }}
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ . | quote }} }
  {{- end }}
---
{{- /*
Network policies (ADR-0021): the grafana namespace denies everything by default. Grafana reaches only its data sources
in monitoring, and only Prometheus reaches it, for its metrics. A port-forward enters the pod's own network namespace
and needs no rule.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { port: 3000, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- range $name, $port := dict "prometheus" 9090 "loki" 3100 "tempo" 3200 "alertmanager" 9093 }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $.Values.monitoringNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
      ports:
        - { port: {{ $port }}, protocol: TCP }
    {{- end }}
