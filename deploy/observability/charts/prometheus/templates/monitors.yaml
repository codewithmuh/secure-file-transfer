{{- /*
What Prometheus scrapes. The application's servers on their internal port only (architecture 8), each namespace with
the components whose network policy admits Prometheus (deploy/charts/sft); the observability stack's own pods; the
egress proxy (architecture 6: "Egress proxy down"); Argo CD's application controller (argocd_app_info, for
ArgoCdApplicationUnhealthy: its chart's policy admits the metrics port from any namespace); the operator's kubelet endpoints for container and volume usage.
kube-state-metrics and the operator come with cluster-bootstrap's release, with their own ServiceMonitors.
*/}}
{{- range $namespace, $components := .Values.application.scraped }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "prom.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $namespace }}]
  selector:
    matchLabels: { app.kubernetes.io/name: sft }
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: {{ toJson $components }} }
  podMetricsEndpoints:
    - port: {{ $.Values.application.port }}
      path: /metrics
      # Labels the pod set itself never override the target's.
      honorLabels: false
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], targetLabel: component }
        - { sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace }
        - { sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod }
{{- end }}
{{- /* The stack's own pods, by name and metrics port (container port name). */}}
{{- $own := list
  (dict "name" "alertmanager" "port" "web" "namespace" .Release.Namespace)
  (dict "name" "prometheus" "port" "web" "namespace" .Release.Namespace)
  (dict "name" "loki" "port" "http-metrics" "namespace" .Release.Namespace)
  (dict "name" "tempo" "port" "prom-metrics" "namespace" .Release.Namespace)
  (dict "name" "otel-gateway" "port" "metrics" "namespace" .Release.Namespace)
  (dict "name" "otel-agent" "port" "metrics" "namespace" "node-agents")
  (dict "name" "grafana" "port" "http" "namespace" "grafana")
  (dict "name" "egress-proxy" "port" "health" "namespace" "egress-proxy" "path" "/stats/prometheus")
  (dict "name" "argocd-application-controller" "port" "metrics" "namespace" "argocd")
}}
{{- range $own }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .name }}
  labels:
    {{- include "prom.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .namespace }}]
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .name }} }
  podMetricsEndpoints:
    - port: {{ .port }}
      path: {{ .path | default "/metrics" }}
{{- end }}
---
# The scheduled jobs' and the probe's pushed metrics keep their own job label (job="<job>"), not the gateway's.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pushgateway
  labels:
    {{- include "prom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudwatch-exporter
  labels:
    {{- include "prom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: cloudwatch-exporter }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.cloudwatchExporter.scrapeInterval }}
      scrapeTimeout: 60s
---
# The kubelets, through the endpoints the operator keeps for the kubelet Service in kube-system: container CPU and
# memory, and volume usage (the observability volumes filling up). Only those series are kept.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet
  labels:
    {{- include "prom.labels" . | nindent 4 }}
spec:
  scrapeClass: kubelet
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels: { app.kubernetes.io/name: kubelet }
  endpoints:
    - port: https-metrics
      scheme: HTTPS
      path: /metrics
      metricRelabelings:
        - { sourceLabels: [__name__], regex: "kubelet_volume_stats_(available|capacity|used)_bytes", action: keep }
    - port: https-metrics
      scheme: HTTPS
      path: /metrics/cadvisor
      metricRelabelings:
        - { sourceLabels: [__name__], regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_periods_total)", action: keep }
