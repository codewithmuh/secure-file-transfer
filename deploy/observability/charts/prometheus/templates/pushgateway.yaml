{{- $g := .Values.pushgateway }}
{{- /*
The Pushgateway (ADR-0009): a one-shot lifecycle job has no port to scrape, so each run pushes its registry here
(sft.workers.jobs, METRICS_PUSHGATEWAY_URL = http://pushgateway.monitoring.svc.cluster.local:9091). One replica with a
small volume: the last push of every job survives a restart.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pushgateway
  labels:
    {{- include "prom.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pushgateway
  labels: { app.kubernetes.io/name: pushgateway, app.kubernetes.io/part-of: sft-observability }
spec:
  replicas: 1
  serviceName: pushgateway
  selector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pushgateway, app.kubernetes.io/part-of: sft-observability }
    spec:
      serviceAccountName: pushgateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.pools.main | nindent 8 }}
      securityContext:
        {{- include "prom.podSecurity" . | nindent 8 }}
      containers:
        - name: pushgateway
          image: {{ include "prom.image" (list . .Values.images.pushgateway) }}
          args:
            - --persistence.file=/data/pushgateway.db
            - --persistence.interval=1m
            - --web.listen-address=:9091
          ports:
            - { name: http, containerPort: 9091, protocol: TCP }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- include "prom.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: observability
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $g.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  labels: { app.kubernetes.io/name: pushgateway, app.kubernetes.io/part-of: sft-observability }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pushgateway }
  ports:
    - { name: http, port: 9091, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pushgateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
