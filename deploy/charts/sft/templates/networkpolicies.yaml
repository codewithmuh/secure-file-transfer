{{- /*
Network policies (ADR-0021): default deny in the namespace, then one policy per workload naming everything it may
reach, never the whole VPC. Every workload may reach CoreDNS, its own proxy listener, the endpoint subnets on 443,
the data stores it uses on their ports, and the Pod Identity agent; those that use S3 may reach addresses outside the
VPC on 443, which the node security groups narrow to S3's prefix list. The API, the operator API and the workers may
also reach the node's OpenTelemetry agent, and the scheduled jobs the Pushgateway in the monitoring namespace. The DLP
inspector gets no egress at all.
*/}}
{{- $n := .Values.network }}
{{- $rules := dict
  "dns" (printf "- to:\n    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: %s } }\n      podSelector: { matchLabels: %s }\n  ports:\n    - { port: 53, protocol: UDP }\n    - { port: 53, protocol: TCP }" $n.dns.namespace (toJson $n.dns.podLabels))
  "endpoints" (printf "- to:\n    - ipBlock: { cidr: %s }\n  ports:\n    - { port: 443, protocol: TCP }" $n.endpointSubnetsCidr)
  "postgres" (printf "- to:\n    - ipBlock: { cidr: %s }\n  ports:\n    - { port: %v, protocol: TCP }" $n.isolatedSubnetsCidr .Values.database.port)
  "valkey" (printf "- to:\n    - ipBlock: { cidr: %s }\n  ports:\n    - { port: 6379, protocol: TCP }" $n.isolatedSubnetsCidr)
  "s3" (printf "- to:\n    - ipBlock: { cidr: 0.0.0.0/0, except: [%s, 169.254.0.0/16] }\n  ports:\n    - { port: 443, protocol: TCP }" $n.vpcCidr)
  "podIdentity" (printf "- to:\n    - ipBlock: { cidr: %s }\n  ports:\n    - { port: 80, protocol: TCP }" $n.podIdentityAgent)
  "fromMonitoring" (printf "- from:\n    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: %s } }\n      podSelector: { matchLabels: %s }\n  ports:\n    - { port: internal, protocol: TCP }" $n.monitoring.namespace (toJson $n.monitoring.podLabels))
  "fromLoadBalancer" (printf "- from:\n    - ipBlock: { cidr: %s }\n  ports:\n    - { port: http, protocol: TCP }\n    - { port: internal, protocol: TCP }" $n.publicSubnetsCidr)
}}
{{- $proxy := dict }}
{{- range $listener, $port := $n.egressProxy.ports }}
{{- $_ := set $proxy $listener (printf "- to:\n    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: %s } }\n      podSelector: { matchLabels: %s }\n  ports:\n    - { port: %v, protocol: TCP }" $n.egressProxy.namespace (toJson $n.egressProxy.podLabels) $port) }}
{{- end }}
{{- $pods := dict
  "toClamd" (printf "- to:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: clamd } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.clamd.port)
  "toInspector" (printf "- to:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: dlp-inspector } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.dlpInspector.port)
  "toMirror" (printf "- to:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: signature-mirror } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.signatureMirror.port)
  "fromWorkerToClamd" (printf "- from:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: scan-worker } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.clamd.port)
  "fromWorkerToInspector" (printf "- from:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: scan-worker } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.dlpInspector.port)
  "fromClamd" (printf "- from:\n    - podSelector: { matchLabels: { app.kubernetes.io/name: sft, app.kubernetes.io/component: clamd } }\n  ports:\n    - { port: %v, protocol: TCP }" .Values.signatureMirror.port)
}}
{{- $base := list $rules.dns $rules.endpoints $rules.postgres $rules.podIdentity }}
{{- /* The traced workloads (the API, the operator API and the workers) send spans to the node's OpenTelemetry agent. */}}
{{- $traced := $base }}
{{- with .Values.telemetry }}
{{- if .otlpEndpoint }}
{{- $traced = append $base (printf "- to:\n    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: %s } }\n      podSelector: { matchLabels: %s }\n  ports:\n    - { port: %v, protocol: TCP }" .namespace (toJson .podLabels) .port) }}
{{- end }}
{{- end }}
{{- $policies := list }}
{{- if eq .Values.part "application" }}
{{- $policies = list
  (dict "component" "api" "ingress" (list $rules.fromLoadBalancer $rules.fromMonitoring) "egress" (concat $traced (list $proxy.api $rules.valkey $rules.s3)))
  (dict "component" "relay" "ingress" (list $rules.fromMonitoring) "egress" $traced)
  (dict "component" "notifier" "ingress" (list $rules.fromMonitoring) "egress" (concat $traced (list $proxy.notifier $rules.valkey)))
  (dict "component" "scan-worker" "ingress" (list $rules.fromMonitoring) "egress" (concat $traced (list $rules.valkey $rules.s3 $pods.toClamd $pods.toInspector)))
  (dict "component" "clamd" "ingress" (list $pods.fromWorkerToClamd) "egress" (list $rules.dns $pods.toMirror))
  (dict "component" "dlp-inspector" "ingress" (list $pods.fromWorkerToInspector) "egress" (list))
  (dict "component" "signature-mirror" "ingress" (list $pods.fromClamd) "egress" (list $rules.dns $proxy.signatureMirror))
  (dict "component" "migrate" "ingress" (list) "egress" $base)
  (dict "component" "invite-backlog" "ingress" (list) "egress" (concat $base (list $proxy.notifier $rules.valkey)))
  (dict "component" "standby-enrolment" "ingress" (list) "egress" (append $base $proxy.notifier))
  (dict "component" "recovery" "ingress" (list) "egress" (append $base $rules.s3))
  (dict "component" "db-bootstrap" "ingress" (list) "egress" $base)
}}
{{- if eq .Values.region "ap-northeast-1" }}
{{- /* No database: the endpoints (Secrets Manager, and the cluster API, whose ENIs share their subnets), its listener. */}}
{{- $policies = append $policies (dict "component" "key-rotation" "ingress" (list) "egress" (list $rules.dns $rules.endpoints $rules.podIdentity $proxy.keyRotation)) }}
{{- /* The field key job (#236): the database and KMS through its endpoint, as the API, nothing else. */}}
{{- $policies = append $policies (dict "component" "field-keys" "ingress" (list) "egress" $base) }}
{{- end }}
{{- /* The scheduled jobs push their metrics to the Pushgateway after each run (#242), when it has a URL. */}}
{{- $jobBase := $base }}
{{- with .Values.metricsPushgateway }}
{{- if .url }}
{{- $jobBase = append $base (printf "- to:\n    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: %s } }\n      podSelector: { matchLabels: %s }\n  ports:\n    - { port: %v, protocol: TCP }" .namespace (toJson .podLabels) .port) }}
{{- end }}
{{- end }}
{{- range $name := keys .Values.lifecycleJobs | sortAlpha }}
{{- $job := index $.Values.lifecycleJobs $name }}
{{- $policies = append $policies (dict "component" $name "ingress" (list) "egress" (ternary (append $jobBase $rules.s3) $jobBase $job.s3)) }}
{{- end }}
{{- else }}
{{- /* The operator API writes its security-critical records to the audit archive (#239): S3, as the API; its jobs
reach Cognito, CloudTrail and the identity store through its own proxy listener (#275). */}}
{{- $policies = list (dict "component" "operator-api" "ingress" (list $rules.fromMonitoring) "egress" (concat $traced (list $proxy.operator $rules.valkey $rules.s3))) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- range $p := $policies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $p.component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" $p.component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sft.selectorLabels" (dict "component" $p.component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if $p.ingress }}
  ingress:
    {{- range $rule := $p.ingress }}
    {{- $rule | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if $p.egress }}
  egress:
    {{- range $rule := $p.egress }}
    {{- $rule | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
