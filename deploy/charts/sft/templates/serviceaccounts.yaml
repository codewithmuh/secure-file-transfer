{{- /*
One ServiceAccount per workload. Those with an AWS role get it from an EKS Pod Identity association on this
namespace and name (cluster stack, #103), which needs no annotation and no Kubernetes API token. clamd, the DLP
inspector and the signature mirror have none (ADR-0019, ADR-0022). No pod mounts an API token.
*/}}
{{- $accounts := list }}
{{- if eq .Values.part "application" }}
{{- $accounts = list .Values.api.serviceAccount .Values.relay.serviceAccount .Values.notifier.serviceAccount .Values.scanWorker.serviceAccount "clamd" "dlp-inspector" "signature-mirror" }}
{{- range $job := .Values.lifecycleJobs }}
{{- $accounts = append $accounts $job.serviceAccount }}
{{- end }}
{{- else }}
{{- $accounts = list .Values.operatorApi.serviceAccount }}
{{- end }}
{{- range $name := $accounts | uniq | sortAlpha }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if and (eq .Values.part "application") (not .Values.pilotLight) }}
---
# The migration job's account is a PreSync hook too, one wave earlier, so it exists before the job on a first sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
{{- end }}
