{{- if eq .Values.part "application" }}
{{- /* The queues are sft-<env>-<region-short>-<name> (infra/modules/queues), so the prefix names the region too. */}}
{{- $queues := dict "SQS_QUEUE_PREFIX" (printf "%s-" (include "sft.namePrefix" .)) }}
{{- /* The outbox relay (architecture 5.3, #51): publishes outbox rows to SQS. No port but the internal one. */}}
{{- $relay := .Values.relay }}
{{- $containers := include "sft.appContainer" (dict "root" $ "name" "relay" "traced" true "module" $relay.module "databaseRole" $relay.databaseRole "env" (merge (dict) $queues $relay.env) "resources" $relay.resources) }}
{{ include "sft.deployment" (dict "root" $ "name" "relay" "held" true "component" "relay" "replicas" $relay.replicas "serviceAccount" $relay.serviceAccount "grace" $relay.terminationGracePeriodSeconds "containers" $containers) }}
---
{{ include "sft.pdb" (dict "root" $ "name" "relay" "component" "relay") }}
---
{{- /* The notification worker (architecture 2): SES through its endpoint, Cognito's admin API through its listener. */}}
{{- $notifier := .Values.notifier }}
{{- /*
How it sends email (sft.core.settings.MailSettings, ADR-0015): SES in this region, from the environment's sending
subdomain, with the region's configuration set, whose events come back on the ses-events queue (#185), linking only
to the web app. And the user pool's admin side (#193): Cognito's admin API on this region's pool, whose ID is also
the pool's provider name, as the API's OIDC_PROVIDER_NAME.
*/}}
{{- $mail := dict
  "MAIL_BACKEND" "ses"
  "MAIL_FROM_ADDRESS" (printf "no-reply@mail.%s" .Values.cluster.serviceDomain)
  "WEB_APP_URL" (printf "https://app.%s" .Values.cluster.serviceDomain)
  "SES_REGION" .Values.region
  "SES_CONFIGURATION_SET" .Values.cluster.sesConfigurationSet
  "USER_POOL_BACKEND" "cognito"
  "USER_POOL_PROVIDER_NAME" .Values.cluster.userPoolId
  "COGNITO_USER_POOL_ID" .Values.cluster.userPoolId }}
{{- /*
Its three keyrings (#178, #179): link-hmac, which only it reads, code-hmac and email-hmac (encryption 6.1). Each names
its secret, which the worker reads itself at start and every 5 minutes, as its own role (encryption 6.4, #184).
*/}}
{{- $keyrings := dict
  "EMAIL_HMAC_KEYRING" (include "sft.keyringRef" (dict "root" $ "name" "email-hmac"))
  "LINK_HMAC_KEYRING" (include "sft.keyringRef" (dict "root" $ "name" "link-hmac"))
  "CODE_HMAC_KEYRING" (include "sft.keyringRef" (dict "root" $ "name" "code-hmac")) }}
{{- $containers = include "sft.appContainer" (dict "root" $ "name" "notifier" "traced" true "module" $notifier.module "databaseRole" $notifier.databaseRole "valkeyUser" $notifier.valkeyUser "proxyListener" "notifier" "env" (merge (dict) $queues $mail $keyrings $notifier.env) "resources" $notifier.resources) }}
{{ include "sft.deployment" (dict "root" $ "name" "notifier" "held" true "component" "notifier" "replicas" $notifier.replicas "serviceAccount" $notifier.serviceAccount "grace" $notifier.terminationGracePeriodSeconds "containers" $containers) }}
---
{{ include "sft.pdb" (dict "root" $ "name" "notifier" "component" "notifier") }}
---
{{- /*
The invitation backlog (#193): the notification worker's settings and identity, `python -m sft.workers.invite_backlog`,
run by hand once (kubectl create job --from=cronjob/invite-backlog). Always suspended, so the schedule never fires. It
reads no keyring, but its settings are the worker's, so they name the same secrets.
*/}}
{{- $backlog := .Values.inviteBacklog }}
{{- $backlogCtx := dict "root" $ "component" "invite-backlog" "serviceAccount" $notifier.serviceAccount }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invite-backlog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sft.labels" $backlogCtx | nindent 4 }}
spec:
  schedule: "0 0 1 1 *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        {{- include "sft.labels" $backlogCtx | nindent 8 }}
    spec:
      backoffLimit: 0 # running it again is safe: a member invited through the pool is skipped
      activeDeadlineSeconds: {{ $backlog.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "sft.labels" $backlogCtx | nindent 12 }}
        spec:
          {{- include "sft.podCommon" $backlogCtx | nindent 10 }}
          restartPolicy: Never
          securityContext:
            {{- include "sft.podSecurityContext" 10001 | nindent 12 }}
          containers:
            {{- include "sft.appContainer" (dict "root" $ "name" "invite-backlog" "module" $backlog.module "databaseRole" $notifier.databaseRole "valkeyUser" $notifier.valkeyUser "proxyListener" "notifier" "env" (merge (dict) $queues $mail $keyrings $notifier.env) "resources" $notifier.resources "job" true) | nindent 12 }}
          volumes:
            {{- include "sft.tmpVolume" . | nindent 12 }}
{{- end }}
