{{- if eq .Values.part "application" }}
{{- /*
The scheduled jobs (architecture 4.5, 5.2; #181, #183, #224): expiry, deletion in both regions, reconciliation, the
daily storage audit, cleanup and purge, audit partition upkeep, and the audit archive every minute. A lifecycle job's
settings (sft.core.settings.JobSettings) come from sft.lifecycleJobEnv: with `lifecycle` its environment and this
region's files buckets, with `s3` and outside dev Osaka's replicas too (architecture 3.3), with `archive` both regions'
audit archive, or during a regional loss the surviving region's alone (auditArchive.survivingRegionOnly, #257). The
audit archive job (ArchiveJobSettings) takes `archive` alone. Every job gets the Pushgateway's URL when
metricsPushgateway.url is set. Each is a CronJob; a run never overlaps the one before it, and a missed run waits
for the next. Suspended in the pilot light, where the database is a read-only replica, and while a failover holds
the workers (failover.holdWorkers).
*/}}
{{- range $name := keys .Values.lifecycleJobs | sortAlpha }}
{{- $job := index $.Values.lifecycleJobs $name }}
{{- $env := printf "- name: DATABASE_URL\n  value: %s" (include "sft.databaseUrl" (dict "root" $ "role" $job.databaseRole) | quote) }}
{{- $c := $.Values.cluster }}
{{- $account := toString $c.accountId }}
{{- $env = include "sft.lifecycleJobEnv" (dict "root" $ "job" $job "env" $env "account" $account) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ include "sft.cronSuspended" $ }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "sft.labels" (dict "root" $ "component" $name) | nindent 8 }}
    spec:
      backoffLimit: 0 # the next scheduled run is the retry; lag alerts cover a failing job (NFR-8, NFR-15)
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      template:
        {{- include "sft.jobPod" (dict "root" $ "component" $name "module" $job.module "serviceAccount" $job.serviceAccount "env" $env "resources" $.Values.lifecycleJobResources) | nindent 8 }}
{{- end }}
{{- end }}

{{- define "sft.lifecycleJobEnv" -}}
{{- $root := .root }}{{ $job := .job }}{{ $account := .account }}
{{- $env := .env }}
{{- $files := dict }}
{{- if or $job.lifecycle $job.archive }}
{{- $_ := set $files "AUDIT_ARCHIVE_TOKYO_BUCKET" (printf "sft-%s-apne1-audit-archive-%s" $root.Values.environment $account) }}
{{- end }}
{{- if $job.lifecycle }}
{{- $env = printf "%s\n- name: ENVIRONMENT\n  value: %s" $env ($root.Values.environment | quote) }}
{{- $env = printf "%s\n- name: SCAN_SMALL_POOL_MAX_BYTES\n  value: %s" $env (toString $root.Values.scanSmallPoolMaxBytes | quote) }}
{{- $prefix := include "sft.namePrefix" $root }}
{{- $_ := set $files "S3_FILES_BUCKET" (printf "%s-files-%s" $prefix $account) }}
{{- $_ := set $files "S3_LARGE_FILES_BUCKET" (printf "%s-large-files-%s" $prefix $account) }}
{{- if and $job.s3 (ne $root.Values.environment "dev") }}
{{- /* The other region's copies: Osaka's replicas from Tokyo, Tokyo's from Osaka after a failover. */}}
{{- $other := ternary "ap-northeast-3" "ap-northeast-1" (eq $root.Values.region "ap-northeast-1") }}
{{- $otherShort := ternary "apne3" "apne1" (eq $root.Values.region "ap-northeast-1") }}
{{- $_ := set $files "S3_REPLICA_REGION" $other }}
{{- $_ := set $files "S3_REPLICA_FILES_BUCKET" (printf "sft-%s-%s-files-%s" $root.Values.environment $otherShort $account) }}
{{- $_ := set $files "S3_REPLICA_LARGE_FILES_BUCKET" (printf "sft-%s-%s-large-files-%s" $root.Values.environment $otherShort $account) }}
{{- end }}
{{- end }}
{{- if and $job.archive (ne $root.Values.environment "dev") }}
{{- $_ := set $files "AUDIT_ARCHIVE_OSAKA_BUCKET" (printf "sft-%s-apne3-audit-archive-%s" $root.Values.environment $account) }}
{{- end }}
{{- if $job.archive }}
{{- /* During a regional loss, the surviving region's archive alone (#257). */}}
{{- $files = merge $files (include "sft.survivingRegionEnv" $root | fromJson) }}
{{- end }}
{{- with $root.Values.metricsPushgateway.url }}
{{- $_ := set $files "METRICS_PUSHGATEWAY_URL" . }}
{{- end }}
{{- range $name := keys $files | sortAlpha }}
{{- $env = printf "%s\n- name: %s\n  value: %s" $env $name (index $files $name | quote) }}
{{- end }}
{{- $env }}
{{- end -}}
