{{- if eq .Values.part "operator" }}
{{- /*
The operator API (FR-34, authn-authz 8.2): namespace sft-operator, which runs nothing else. No Service, no load
balancer: operators reach it with `kubectl port-forward`, which only the Operator group may do here.
*/}}
{{- $w := .Values.operatorApi }}
{{- /*
The audit archive of both regions, as the API's (#177), for `recoverTenantAdmin`'s security-critical record (#239), and
the surviving region's alone during a regional loss (#257).

Its two jobs (#239, #275; authn-authz 2.5, 8.3), from the cluster facts Terraform hands the root Application, which a
values file can't replace. They reach AWS through the operator listener of the egress proxy (ADR-0021): Cognito, and
the management account's CloudTrail and identity store in Tokyo.
- The break-glass reconciliation: BREAK_GLASS_TRAIL_ROLE_ARN, BREAK_GLASS_PERMISSION_SET_ARN and IDENTITY_STORE_ID,
  from the organization stack's outputs, all three or none; off until the trail role exists.
- The SSO drift check: SSO_DRIFT_POOLS, this region's pool and app client, and in Tokyo outside dev Osaka's too (the
  identity layer's outputs, as the key rotation job's). Osaka's stacks never read Tokyo's state (ADR-0005), so after a
  failover Osaka's operator API checks the pool that serves. Off until the user pool exists.
*/}}
{{- $c := .Values.cluster }}
{{- $jobs := dict }}
{{- if or $c.breakGlassTrailRoleArn $c.breakGlassPermissionSetArn $c.identityStoreId }}
{{- $_ := set $jobs "BREAK_GLASS_TRAIL_ROLE_ARN" (required "cluster.breakGlassTrailRoleArn goes with the permission set and the identity store (#275)" $c.breakGlassTrailRoleArn) }}
{{- $_ := set $jobs "BREAK_GLASS_PERMISSION_SET_ARN" (required "cluster.breakGlassPermissionSetArn goes with the trail role (#275)" $c.breakGlassPermissionSetArn) }}
{{- $_ := set $jobs "IDENTITY_STORE_ID" (required "cluster.identityStoreId goes with the trail role (#275)" $c.identityStoreId) }}
{{- end }}
{{- if $c.userPoolId }}
{{- $pools := list (dict "region" .Values.region "user_pool_id" $c.userPoolId "client_id" (required "cluster.appClientId: the drift check reads the app client (#275)" $c.appClientId)) }}
{{- if and (eq .Values.region "ap-northeast-1") (ne .Values.environment "dev") }}
{{- $pools = append $pools (dict "region" "ap-northeast-3" "user_pool_id" (required "cluster.standbyUserPoolId: Tokyo checks Osaka's pool too (#275)" $c.standbyUserPoolId) "client_id" (required "cluster.standbyAppClientId (#275)" $c.standbyAppClientId)) }}
{{- end }}
{{- $_ := set $jobs "SSO_DRIFT_POOLS" (toJson $pools) }}
{{- end }}
{{- $archive := dict "AUDIT_ARCHIVE_TOKYO_BUCKET" (printf "sft-%s-apne1-audit-archive-%s" .Values.environment (toString .Values.cluster.accountId)) }}
{{- if ne .Values.environment "dev" }}
{{- $_ := set $archive "AUDIT_ARCHIVE_OSAKA_BUCKET" (printf "sft-%s-apne3-audit-archive-%s" .Values.environment (toString .Values.cluster.accountId)) }}
{{- end }}
{{- $archive = merge $archive (include "sft.survivingRegionEnv" . | fromJson) }}
{{- $env := merge (merge (dict
  "OPERATOR_ENVIRONMENT" .Values.environment
  "OPERATOR_AWS_ACCOUNT_ID" (toString .Values.cluster.accountId)
  "OPERATOR_ROLE_NAME" .Values.cluster.operatorRoleName) $jobs) $archive $w.env }}
{{- $containers := include "sft.appContainer" (dict "root" $ "name" "operator-api" "traced" true "module" $w.module "publicPort" 8000 "databaseRole" $w.databaseRole "valkeyUser" $w.valkeyUser "proxyListener" "operator" "env" $env "preStop" true "resources" $w.resources) }}
{{ include "sft.deployment" (dict "root" $ "name" "operator-api" "component" "operator-api" "replicas" $w.replicas "serviceAccount" $w.serviceAccount "grace" $w.terminationGracePeriodSeconds "containers" $containers) }}
---
{{ include "sft.pdb" (dict "root" $ "name" "operator-api" "component" "operator-api") }}
---
# The Operator permission set's group may port-forward here and nowhere else in the application namespaces
# (ADR-0004, authn-authz 8.1). The ClusterRole is the cluster-bootstrap stack's (#104).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-portforward
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sft.labels" (dict "root" $ "component" "operator-api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sft:portforward
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: sft:operator
{{- end }}
