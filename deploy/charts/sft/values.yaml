# Defaults for every cluster. Each cluster's file in deploy/environments/<env>/<region>/values.yaml sets what differs,
# and the root Argo CD Application, which Terraform makes, supplies `environment`, `region` and `cluster` (facts only
# Terraform knows, such as account IDs, which are never committed). deploy/README.md explains the layout.

# dev | staging | prod, and ap-northeast-1 (Tokyo) | ap-northeast-3 (Osaka). From the root Application.
environment: ""
region: ""

# From the root Application (cluster-bootstrap stack, #104), which reads them from the data layer's state and the
# stack's own inputs. CI renders with obviously fake ones (deploy/render.sh, deploy/tests/).
cluster:
  registry: "" # <shared account>.dkr.ecr.<region>.amazonaws.com: our ECR, the Osaka replica in Osaka (ADR-0007)
  databaseHost: "" # the Aurora cluster endpoint in this region (ADR-0011)
  accountId: "" # this environment's account: the files buckets' names, the operator API's token checks (authn-authz 8.2)
  operatorRoleName: "" # the IAM role of the Operator permission set in this account
  # The environment's names in the shared zone (edge stack, #105): sft.<domain> in prod, <env>.sft.<domain> elsewhere.
  # The API is api.<serviceDomain>, the web app app.<serviceDomain>.
  serviceDomain: ""
  valkeyHost: "" # the counter store's endpoint in this region (ADR-0014); TLS on 6379
  filesKeyArn: "" # the files key in this region, which the files buckets' policies require by ARN (encryption 3.1)
  # Member sign-in (ADR-0016, authn-authz 2): this region's user pool and its managed login domain. Empty until the
  # user pool's stack exists; the application part refuses to render without them.
  userPoolId: ""
  cognitoLoginDomain: ""
  # The identity layer's other outputs (#185): this region's SES configuration set, sft-<env>, which every email is
  # sent with (ADR-0015); and, for the key rotation job in Tokyo, this region's app client and in staging and prod
  # Osaka's pool and client, whose secrets it rotates (encryption 6.4). Empty until the layer exists.
  sesConfigurationSet: ""
  appClientId: ""
  standbyUserPoolId: ""
  standbyAppClientId: ""
  # The operator API's break-glass reconciliation (#239, #275; authn-authz 8.3), from the organization stack's outputs:
  # the management account's read-only role for this environment, the BreakGlass permission set and Identity Center's
  # identity store. Empty until the organization stack has made the role; the reconciliation is off while any is.
  breakGlassTrailRoleArn: ""
  breakGlassPermissionSetArn: ""
  identityStoreId: ""

# The keyrings are read from Secrets Manager by the API and the notification worker themselves, at start and every 5
# minutes, as their own roles (encryption 6.4, #184): their settings only name the secret. The user pool client's ID
# and secret still come through External Secrets: the cluster-bootstrap stack's store, which only the sft namespace
# may use, writes them into the API's Secret, read as environment variables. Nothing secret is in Git or in these values.
secrets:
  store: application-secrets
  refreshInterval: 1h

# Which namespace this release fills: `application` (namespace sft) or `operator` (namespace sft-operator, the
# operator API alone, authn-authz 8.2). The two Argo CD Applications render the same chart with the same values files.
part: application

# Osaka's pilot light (architecture 3.2, ADR-0004): every workload at zero replicas, every CronJob suspended and no
# migration job, because Osaka's database is a read-only replica until a failover. The failover's fencing commit sets
# it to false here and true in Tokyo.
pilotLight: false

# A regional failover's hold (architecture 7, docs/runbooks/regional-failover.md): with holdWorkers true, the relay, the
# notifier, the scan trios and the signature mirror run at zero replicas and every CronJob is suspended, while the API,
# the operator API and the migration job run. The fencing commit (ops/failover-values.sh) sets it with pilotLight false
# in the region taking over; a second commit releases the workers once the recovery job has re-applied the
# security-critical changes.
failover:
  holdWorkers: false

# The audit archive during a regional loss (#257, docs/runbooks/regional-failover.md): every security-critical record
# and every archive batch goes to both regions' archive (architecture 5.2), so with one region lost, grants would fail.
# The failover runbook names the region that is left (ap-northeast-3 when Tokyo is lost): the API, the operator API,
# the lifecycle jobs and the archive job then write its archive alone (AUDIT_ARCHIVE_SURVIVING_REGION), and the archive job records what
# the other region lacks. Failback sets it back to empty, and the archive job back-fills the other region with the same
# objects. Never set in dev, which has Tokyo alone.
auditArchive:
  survivingRegionOnly: ""

# The application image: one image for the API and every worker (architecture 2). The digest is the only line the
# promotion workflow edits, in each cluster's values file (ADR-0005, #107).
image:
  repository: sft/app
  digest: ""

# Third-party images, mirrored by digest into our registry's mirror/ repositories (ADR-0007, T-70). The tag is for
# readers; only the digest is pulled. It is the image the local stack's clamd runs (compose.yaml).
clamav:
  repository: mirror/clamav/clamav
  tag: 1.5.4-debian
  digest: sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1

logLevel: info

# Traces (ADR-0009, #243): the API, the operator API and the workers send spans over OTLP/HTTP to the node's own
# OpenTelemetry agent (deploy/observability/charts/collectors), whose Service keeps traffic on the node. Their network
# policies admit the agent on `port`. An empty `otlpEndpoint` leaves OTEL_EXPORTER_OTLP_ENDPOINT unset: spans are
# still made for the logs' trace IDs, but not exported.
telemetry:
  otlpEndpoint: http://otel-agent.node-agents.svc.cluster.local:4318
  namespace: node-agents
  podLabels: { app.kubernetes.io/name: otel-agent }
  port: 4318

database:
  port: 5432
  name: sft
  # IAM authentication: the URL names the workload's login role and the host, never a password; each pod signs a token
  # per connection (DATABASE_IAM_AUTH, encryption 6.3), which needs TLS with the server's certificate verified.
  options: sslmode=verify-full

# Where pods may go (ADR-0021). The CIDRs are per cluster, from the network module's layout (infra/modules/network).
network:
  vpcCidr: ""
  publicSubnetsCidr: "" # the load balancer, which reaches the API pods
  endpointSubnetsCidr: "" # the interface endpoints, 443
  isolatedSubnetsCidr: "" # Aurora 5432 and Valkey 6379
  podIdentityAgent: 169.254.170.23/32 # EKS Pod Identity's credentials endpoint on every node, port 80
  dns:
    namespace: kube-system
    podLabels: { k8s-app: kube-dns }
  monitoring: # Prometheus scrapes the internal port (ADR-0009)
    namespace: monitoring
    podLabels: { app.kubernetes.io/name: prometheus }
  egressProxy: # one listener per workload (ADR-0021, #104)
    namespace: egress-proxy
    host: egress-proxy.egress-proxy.svc.cluster.local
    podLabels: { app.kubernetes.io/name: egress-proxy }
    ports: { api: 3128, notifier: 3129, signatureMirror: 3130, keyRotation: 3133, operator: 3135 }

# Node pools (ADR-0004, #103): main for most workloads, scan for the scan trios, which are tainted. No pod here may
# run on, or tolerate, the system pool.
pools:
  main: { nodeSelector: { sft.io/pool: main }, tolerations: [] }
  scan:
    nodeSelector: { sft.io/pool: scan }
    tolerations: [{ key: sft.io/pool, operator: Equal, value: scan, effect: NoSchedule }]

# How long a preStop hook holds SIGTERM back, so a pod leaves its Service endpoints and the load balancer's targets
# before the server stops accepting (architecture 8).
preStopSleepSeconds: 15

# ---- Long-running workloads (Deployments). Every one runs as a non-root user with a read-only root file system, no
# capabilities, no privilege escalation, the RuntimeDefault seccomp profile and no service account token; Pod
# Identity gives the ones that call AWS their own role without one (#103). ----

api:
  replicas: 3
  module: sft.api
  serviceAccount: api # Pod Identity: sft-<env>-api
  databaseRole: sft_api
  valkeyUser: api # Valkey user sft-<env>-api, IAM-authenticated (ADR-0014)
  # Download streams get up to 120 s after SIGTERM, then close and resume (abuse 5.7); 15 s of preStop plus 120 s of
  # drain fit the 150 s grace period of architecture 8.
  terminationGracePeriodSeconds: 150
  env:
    SHUTDOWN_DRAIN_SECONDS: "120"
    DATABASE_POOL_SIZE: "10"
  resources: # capacity 4.1
    requests: { cpu: "1", memory: 1Gi }
    limits: { memory: 1536Mi }

relay:
  replicas: 2 # rows are claimed with FOR UPDATE SKIP LOCKED (architecture 5.3)
  module: sft.workers.relay
  serviceAccount: relay
  databaseRole: sft_relay
  terminationGracePeriodSeconds: 30 # its drain is 15 s
  env:
    DATABASE_POOL_SIZE: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 512Mi }

notifier:
  replicas: 2
  module: sft.workers.notify
  serviceAccount: notifier
  databaseRole: sft_notify
  valkeyUser: notify
  terminationGracePeriodSeconds: 30
  env: {}
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 768Mi }

# The scan trios (ADR-0019, ADR-0022, capacity 4.2): in each pool a scan worker, a clamd pod and a DLP inspector per
# scan node, one of each kind per node. Pools split at 100 MB, so large files don't delay small ones.
scanPools:
  small: { replicas: 3 }
  large: { replicas: 2 }

scanWorker:
  module: sft.workers.scan # SCAN_POOL says which queue it reads
  serviceAccount: scan-worker
  databaseRole: sft_scan
  valkeyUser: scan
  terminationGracePeriodSeconds: 60
  env: {}
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }

clamd: # third-party, from the clamav image; no identity, ingress only from the scan workers
  port: 3310
  terminationGracePeriodSeconds: 30
  scratch: 4Gi # streamed files and temporary extraction, on the node's volume under the files key
  resources:
    requests: { cpu: "1", memory: 4Gi, ephemeral-storage: 5Gi }
    limits: { memory: 4Gi, ephemeral-storage: 6Gi }

dlpInspector: # our image; no identity, no egress at all, ingress only from the scan workers
  module: sft.dlp.inspector
  # One file per connection, on the inspector's own framed protocol (sft.dlp.protocol). Its probes are on the internal
  # port, 8001, plain HTTP (#184).
  port: 8070
  terminationGracePeriodSeconds: 30
  scratch: 4Gi
  resources:
    requests: { cpu: 1500m, memory: 2560Mi, ephemeral-storage: 4Gi }
    limits: { memory: 3Gi, ephemeral-storage: 5Gi }

# The private signature mirror (ADR-0019, capacity 3.3): freshclam fetches ClamAV's database through its proxy
# listener and tests each new database once; a static file server from our image serves it to the clamd pods.
signatureMirror:
  replicas: 1
  port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    freshclam: # loads the database once to test it (capacity 3.3)
      requests: { cpu: 100m, memory: 1536Mi, ephemeral-storage: 1Gi }
      limits: { memory: 2Gi, ephemeral-storage: 2Gi }
    server:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }

operatorApi: # namespace sft-operator, port-forward only, never on a load balancer (authn-authz 8.2)
  replicas: 1
  module: sft.api.operator
  serviceAccount: operator-api
  databaseRole: sft_operator
  valkeyUser: operator # its own rate limits (authn-authz 8.2)
  terminationGracePeriodSeconds: 60 # 15 s of preStop and its 20 s drain
  env:
    DATABASE_POOL_SIZE: "2"
    # A requester may approve their own break-glass grant only where a cluster's values say so: the single-maintainer
    # reference run (authn-authz 8.3, threat model R-08). Such a grant is marked and pages (BreakGlassSelfApproved).
    BREAK_GLASS_SELF_APPROVAL: "false"
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 768Mi }

# ---- Scheduled jobs (architecture 4.5, 5.2). Times are UTC. Each run is a fresh pod that exits; a run never overlaps
# the one before it. ----

# The lifecycle jobs (#181, sft.service.lifecycle) read JobSettings: `lifecycle` gives a job ENVIRONMENT and this
# region's files buckets, `s3` the egress to S3 and, outside dev, Osaka's replicas, `archive` both regions' audit
# archive. The audit archive job reads ArchiveJobSettings (#183): `archive` alone. Every job pushes its metrics to the
# Pushgateway after its run (metricsPushgateway below).
lifecycleJobs:
  expiry: # records expiry of transfers past expires_at, and cancels drafts idle for 7 days
    schedule: "*/5 * * * *"
    module: sft.workers.expiry
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: false
    activeDeadlineSeconds: 240
  deletion: # deletes every version of due files in both regions; the only workload that deletes objects
    schedule: "*/5 * * * *"
    module: sft.workers.deletion
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: true
    activeDeadlineSeconds: 1800
  reconciliation: # stale uploads, stuck completions, the scan sweep, grants whose committed record is missing
    schedule: "*/5 * * * *"
    module: sft.workers.reconciliation
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: true
    archive: true
    activeDeadlineSeconds: 240
  storage-audit: # daily: compares the buckets with the metadata, deletes orphans, aborts stale multipart uploads
    schedule: "17 3 * * *"
    module: sft.workers.storage_audit
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: true
    activeDeadlineSeconds: 7200
  cleanup: # daily: deletes expired verification codes, link sessions and download grants
    schedule: "29 3 * * *"
    module: sft.workers.cleanup
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: false
    activeDeadlineSeconds: 900
  audit-archive: # every minute: committed audit events to both regions' Object Lock archive (#183, NFR-15)
    schedule: "* * * * *"
    module: sft.workers.audit_archive
    serviceAccount: audit-archive
    databaseRole: sft_archive
    s3: true
    archive: true
    activeDeadlineSeconds: 300
  audit-partitions: # daily: keeps three months of audit partitions ahead and exports their gauges (data model 6)
    schedule: "41 2 * * *"
    module: sft.workers.audit_partitions
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: false
    activeDeadlineSeconds: 900
  purge: # daily: transfers and upload requests 372 days past their end, with their child rows (#224, NFR-9)
    schedule: "53 3 * * *"
    module: sft.workers.purge
    serviceAccount: jobs
    databaseRole: sft_jobs
    lifecycle: true
    s3: false
    activeDeadlineSeconds: 3600

# The key rotation job (encryption 6.4, 6.5; #185): Tokyo only, hourly, the only writer of the sft/<env>/app/* secrets.
# The workloads read the keyrings themselves every 5 minutes (#184); after a new user pool client secret, which the API
# reads at start through `api-secrets`, it has External Secrets sync that and restarts the API, with a projected
# Kubernetes token its Role limits to those names; no other pod has a token.
keyRotation:
  schedule: "7 * * * *"
  module: sft.workers.key_rotation
  serviceAccount: key-rotation # Pod Identity: sft-<env>-key-rotation
  activeDeadlineSeconds: 900
  externalSecrets: [api-secrets]
  deployments: [api]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 256Mi }

# The field key job (#236, encryption and keys 3.2, 7.2), in Tokyo only: it runs as the API (the API's service account, so
# the sft-<env>-api role, the only one whose fields key statement unwraps field data keys, and the sft_api login). Each
# run takes `steps` in order: rotate a data key version older than a year, reseal what isn't under the live version
# (the backfill of #236, and the re-encryption after a rotation), purge versions no row uses. `rewrap` is run by hand
# (kubectl create job --from=cronjob/field-keys, runbook field-keys).
fieldKeys:
  schedule: "37 3 * * *"
  module: sft.workers.field_keys
  steps: [rotate, backfill, purge]
  activeDeadlineSeconds: 3600
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 256Mi }

# The invitation backlog (#193): a one-off pass that invites, through the user pool, every member left `invited` before
# it existed. A CronJob that is always suspended, run by hand once the pool exists: kubectl create job --from=cronjob/
# invite-backlog invite-backlog-1 (deploy/README.md). It runs as the notification worker, with its settings.
inviteBacklog:
  module: sft.workers.invite_backlog
  activeDeadlineSeconds: 3600

# The recovery job (#258; sft.workers.recovery, docs/operations/disaster-recovery.md 4): a CronJob that is always
# suspended, run by hand by the restore, failover and failback runbooks, which render a Job from it with their steps
# and times (ops/lib/common.sh). It runs as sft_recovery with its own service account (Pod Identity: sft-<env>-recovery,
# which lists and reads the audit archive in every region) and reads this region's (AUDIT_ARCHIVE_BUCKET), or Osaka's
# for the failback's replay (AUDIT_ARCHIVE_REGION, #276).
recovery:
  module: sft.workers.recovery
  serviceAccount: recovery # Pod Identity: sft-<env>-recovery
  databaseRole: sft_recovery
  activeDeadlineSeconds: 3600
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi } # the replay holds the window's records in memory

# The database bootstrap job (#278; sft.data.bootstrap, encryption 6.3, data model 7; templates/db-bootstrap.yaml):
# creates the login roles as the Aurora master user, as a PreSync hook before the migration. Off: a reviewed commit
# sets runOnSync to true in a Tokyo values file for the sync that needs it (an environment's first deploy, or a new
# login role), and the next commit sets it back, so the master password is read only then. It reads the password from
# Secrets Manager itself, as its own role (sft-<env>-db-bootstrap), the only workload that may; the password is never
# in the pod spec or a Kubernetes Secret.
dbBootstrap:
  runOnSync: false
  module: sft.data.bootstrap
  serviceAccount: db-bootstrap # Pod Identity: sft-<env>-db-bootstrap
  masterUser: sft_master # infra/modules/aurora's master_username
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# The standby enrolment (#258; authn-authz 2.6): after a regional failover, every active local member gets a user in
# this region's pool and a re-enrolment invitation. Always suspended, run by hand once by the failover runbook after the
# recovery job's replay: kubectl create job --from=cronjob/standby-enrolment. It runs as the notification worker, with
# its settings, its service account and its proxy listener, like invite-backlog.
standbyEnrolment:
  module: sft.workers.standby_enrolment
  activeDeadlineSeconds: 3600

# ADR-0019's split between the scan pools, in bytes: the API routes a completed file by it, and so does
# reconciliation when it finishes a completion (#181). One value, so the two never differ.
scanSmallPoolMaxBytes: "100000000"

# Where the scheduled jobs and the synthetic probe push their metrics after each run (#242, #248, ADR-0009): a one-shot
# pod has no port to scrape. The Pushgateway is the observability stack's (#243,
# deploy/observability/charts/prometheus/templates/pushgateway.yaml), scraped with honor_labels so each push keeps its
# own job label. Their network policies admit it on `port`. An empty `url` leaves METRICS_PUSHGATEWAY_URL unset, and
# the jobs only log their metrics.
metricsPushgateway:
  url: http://pushgateway.monitoring.svc.cluster.local:9091
  namespace: monitoring
  podLabels: { app.kubernetes.io/name: pushgateway }
  port: 9091

lifecycleJobResources: # capacity 4.1
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 1Gi }

# The migration job: an Argo CD PreSync hook, so a failed or refused migration stops the sync before any pod changes
# (ADR-0005). The module decides whether to upgrade, do nothing, or skip after a rollback (data model 7).
migration:
  module: sft.data.migrate
  serviceAccount: migrate # Pod Identity: sft-<env>-migrate, which signs the sft_migrate login
  databaseRole: sft_migrate
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 512Mi }

# The synthetic probe (#248, NFR-1, NFR-4; templates/probe.yaml, docs/runbooks/synthetic-probe.md): every 5 minutes, the
# whole journey through the public API as the synthetic tenant. Off until an environment's values file turns it on,
# once its AWS side exists (the runbook's setup list): the Pod Identity role sft-<env>-synthetic-probe for this service
# account, the proxy listener on proxyPort, the secret sft/<env>/app/probe-api-key and the probe mailbox.
probe:
  enabled: false
  schedule: "*/5 * * * *"
  module: sft.probe
  serviceAccount: synthetic-probe # Pod Identity: sft-<env>-synthetic-probe
  activeDeadlineSeconds: 285 # inside the 5 minutes, so runs never overlap; the probe stops itself at timeoutSeconds
  timeoutSeconds: 240
  proxyPort: 3134 # its own listener (ADR-0021): api.<serviceDomain>, app.<serviceDomain>, monitoring.<region>
  mailboxDomain: "" # probe.<serviceDomain> when empty; SES receives it into <prefix>-probe-mailbox-<account>
  mailboxPrefix: probe/
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 256Mi }
