# freshclam in the signature mirror: fetches ClamAV's database through its own egress proxy listener (ADR-0021) and
# tests each new database once before the clamd pods can fetch it (capacity 3.3). Whole .cvd files, no DNS lookups:
# DNS Firewall answers only allowed names, and the proxy resolves the mirror's name itself.
DatabaseDirectory /var/lib/clamav
Foreground yes
DatabaseMirror database.clamav.net
HTTPProxyServer {{ .Values.network.egressProxy.host }}
HTTPProxyPort {{ .Values.network.egressProxy.ports.signatureMirror }}
ScriptedUpdates no
TestDatabases yes
DNSDatabaseInfo no
Checks 12
