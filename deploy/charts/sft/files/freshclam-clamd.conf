# freshclam inside each clamd pod: updates only from the private signature mirror, the one place clamd may reach
# (ADR-0019). The mirror has already tested each database, so this updater doesn't load a third copy (capacity 3.3).
DatabaseDirectory /var/lib/clamav
Foreground yes
PrivateMirror http://signature-mirror.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.signatureMirror.port }}
ScriptedUpdates no
TestDatabases no
DNSDatabaseInfo no
Checks 24
NotifyClamd /etc/clamav/clamd.conf
