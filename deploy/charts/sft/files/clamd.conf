# clamd in EKS (ADR-0019): the local stack's settings (local/clamav/clamd.conf) with disk scratch. It runs as the
# unprivileged clamav user on a read-only root file system. The scan worker streams bytes to it with INSTREAM.
Foreground yes
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket {{ .Values.clamd.port }}

# INSTREAM writes the stream here before scanning: 4 GiB of the scan node's encrypted volume (ADR-0019).
TemporaryDirectory /scratch

# Size limits (abuse and rate limits 6.4): ClamAV scans files up to 2,000,000,000 bytes; larger files go to GuardDuty.
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 4000M

# A limit never counts as clean: exceeded limits and encrypted content are detections the scan worker maps to
# "unscannable".
AlertExceedsMax yes
AlertEncrypted yes

# Zip bombs (abuse and rate limits 6.4), the local stack's values, tested by the scan worker (#175): nesting, file
# count and scan time. A ratio bomb stops at MaxFileSize or MaxScanSize.
MaxRecursion 10
MaxFiles 10000
MaxScanTime 300000

# Signature updates load a second engine while the first keeps scanning (capacity 3.3, sized for it).
ConcurrentDatabaseReload yes
