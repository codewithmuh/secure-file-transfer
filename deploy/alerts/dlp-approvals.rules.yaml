# Alerts of DLP approvals (FR-43; architecture 6, "Approvals not decided"; abuse 8.2, DlpApprovalBacklog; #245), tested
# by deploy/alerts/tests/dlp-approvals.test.yaml.
#
# The series come from the notification worker (sft.service.notifications): emails_sent_total{type} and
# email_caps_hit_total{cap}. When a sender's transfer needs approval and the tenant has no eligible approver, every
# active admin gets `dlp_no_eligible_approver`, capped per tenant (`tenant_no_eligible_approver`). And from the expiry
# job (sft.service.lifecycle, #260), which pushes them every 5 minutes: dlp_approval_pending_timeout_used_ratio, the
# largest share of its tenant's approval timeout a pending request has used, and dlp_approval_oldest_pending_age_seconds.
groups:
  - name: dlp-approvals
    rules:
      # A tenant's rules ask for approval that nobody can give, so its transfers wait until their requests expire and
      # go back to their senders. Tenant admins are told; this tells the operator, who can tell the tenant.
      - alert: DlpApprovalBacklog
        expr: |
          sum(increase(emails_sent_total{type="dlp_no_eligible_approver"}[1h])) > 0
          or
          sum(increase(email_caps_hit_total{cap="tenant_no_eligible_approver"}[1h])) > 0
        labels:
          severity: ticket
          condition: no_eligible_approver
        annotations:
          summary: A tenant's DLP rules need approval but it has no eligible approver; its transfers wait (FR-43).
          runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/dlp-approvals.md

      # Abuse 8.2: a pending request older than half its tenant's approval timeout. Its approvers haven't acted; when it
      # expires the transfer goes back to its sender (FR-43). Tenants set their own timeout, so the ratio, not the age.
      - alert: DlpApprovalBacklog
        expr: max(dlp_approval_pending_timeout_used_ratio) > 0.5
        for: 10m
        labels:
          severity: ticket
          condition: pending_half_timeout
        annotations:
          summary: A DLP approval request has waited more than half its tenant's approval timeout (FR-43).
          runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/dlp-approvals.md
