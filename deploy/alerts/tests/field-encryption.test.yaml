# Unit tests of field-encryption.rules.yaml: `promtool test rules deploy/alerts/tests/*.test.yaml` (CI's deploy job).
rule_files:
  - ../field-encryption.rules.yaml

evaluation_interval: 1m

tests:
  # #236: one value of another tenant pages; unwraps that succeed don't.
  - interval: 1m
    input_series:
      - series: 'field_decrypt_scope_mismatch_total{purpose="field-dek", job="api"}'
        values: '0 0 1 1 1'
      - series: 'field_key_unwraps_total{purpose="field-dek", result="ok", job="api"}'
        values: '0 5 10 15 20'
    alert_rule_test:
      - eval_time: 1m
        alertname: FieldDecryptScopeMismatch
        exp_alerts: []
      - eval_time: 3m
        alertname: FieldDecryptScopeMismatch
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: A sealed value didn't open with the caller's tenant's key, a possible isolation breach (NFR-12).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/field-keys.md
      - eval_time: 4m
        alertname: FieldKeysUnavailable
        exp_alerts: []

  # #236: KMS errors that last 10 minutes page.
  - interval: 1m
    input_series:
      - series: 'field_key_unwraps_total{purpose="dlp-dek", result="error", job="scan-worker"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: FieldKeysUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: FieldKeysUnavailable
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: KMS refuses or fails data key calls, so sealed fields can't be read or written (#236).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/field-keys.md
