# Unit tests of pipeline.rules.yaml: `promtool test rules deploy/alerts/tests/*.test.yaml` (CI's deploy job).
rule_files:
  - ../pipeline.rules.yaml

evaluation_interval: 1m

tests:
  # NFR-5: the oldest row grows past 2 minutes and stays there for 5: a page. Under 2 minutes, nothing.
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_unpublished_age_seconds{job="relay"}'
        values: '0 0 30 90 150 210 270 330 390 450 510 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 9m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels:
              severity: page
              condition: backlog
            exp_annotations:
              summary: The oldest unsent outbox message is over 2 minutes old; scans and emails wait behind it (NFR-5).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/outbox-backlog.md
      - eval_time: 11m
        alertname: OutboxBacklog
        exp_alerts: []

  # No relay series at all for 10 minutes: the relay is down or not scraped.
  - interval: 1m
    input_series:
      - series: 'worker_messages_total{consumer="notify", outcome="processed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 12m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels:
              severity: page
              condition: relay_missing
            exp_annotations:
              summary: No outbox relay has reported for 10 minutes; nothing is being sent to the queues (NFR-5).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/outbox-backlog.md

  # NFR-7: 10 % of email messages fail for 10 minutes: a page. 1 % doesn't.
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_unpublished_age_seconds{job="relay"}'
        values: '0x40'
      - series: 'worker_messages_total{consumer="notify", outcome="processed"}'
        values: '0+90x40'
      - series: 'worker_messages_total{consumer="notify", outcome="failed"}'
        values: '0+10x40'
      - series: 'worker_messages_total{consumer="ses-events", outcome="failed"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: EmailDeliveryFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: EmailDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: More than 5 % of email messages fail; verification codes and link emails are late or lost (NFR-7).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/email-delivery.md
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_unpublished_age_seconds{job="relay"}'
        values: '0x40'
      - series: 'worker_messages_total{consumer="notify", outcome="processed"}'
        values: '0+99x40'
      - series: 'worker_messages_total{consumer="notify", outcome="failed"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: EmailDeliveryFailing
        exp_alerts: []
