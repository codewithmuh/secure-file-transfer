# Unit tests of scanning.rules.yaml: `promtool test rules deploy/alerts/tests/*.test.yaml` (CI's deploy job).
rule_files:
  - ../scanning.rules.yaml

evaluation_interval: 1m

tests:
  # #175: a file failed for an engine error pages; one over 2 GB that no engine scans doesn't.
  - interval: 1m
    input_series:
      - series: 'scan_results_total{state="scan_failed", reason="engine_error", job="scan-worker"}'
        values: '0 0 1 1 1'
      - series: 'scan_results_total{state="scan_failed", reason="large_file_scanning_unavailable", job="jobs"}'
        values: '0 1 2 3 4'
      - series: 'scan_results_total{state="clean", reason="none", job="scan-worker"}'
        values: '0 10 20 30 40'
    alert_rule_test:
      - eval_time: 1m
        alertname: ScanFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: ScanFailed
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: A file ended scan_failed, or a scan message is in a dead-letter queue (FR-19).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/scan-failed.md

  # #175: only large files waiting for GuardDuty: no page.
  - interval: 1m
    input_series:
      - series: 'scan_results_total{state="scan_failed", reason="large_file_scanning_unavailable"}'
        values: '0 1 2 3 4 5'
      - series: 'scan_results_total{state="scan_failed", reason="deadline_passed"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: ScanFailed
        exp_alerts: []

  # #175: a scan message in a dead-letter queue pages, whatever the files' states.
  - interval: 1m
    input_series:
      - series: 'aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName="sft-prod-apne1-scan-large-dlq"}'
        values: '0 0 2 2'
      - series: 'aws_sqs_approximate_number_of_messages_visible_maximum{dimension_QueueName="sft-prod-apne1-notify-dlq"}'
        values: '5 5 5 5'
    alert_rule_test:
      - eval_time: 1m
        alertname: ScanFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: ScanFailed
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: A file ended scan_failed, or a scan message is in a dead-letter queue (FR-19).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/scan-failed.md

  # #176: an inspector failing on every attempt: its failures count, the file ends failed, and the alert fires.
  - interval: 1m
    input_series:
      - series: 'dlp_inspector_failures_total{kind="engine_error"}'
        values: '0 1 2 3 4 5'
      - series: 'dlp_inspection_results_total{state="failed", reason="none"}'
        values: '0 0 0 0 0 1'
      - series: 'dlp_inspection_results_total{state="inspected", reason="none"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: DlpInspectorFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: DlpInspectorFailing
        exp_alerts:
          - exp_labels:
              severity: page
              condition: failed_inspection
            exp_annotations:
              summary: A file's DLP inspection failed on every attempt; the file is blocked (FR-47).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/dlp-inspector.md

  # #176: failures above 1 % of inspections for 10 minutes fire; under 1 % they don't.
  - interval: 1m
    input_series:
      - series: 'dlp_inspector_failures_total{kind="timeout"}'
        values: '0+2x40'
      - series: 'dlp_inspection_results_total{state="inspected", reason="none"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 8m # above 1 %, but not yet for 10 minutes
        alertname: DlpInspectorFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: DlpInspectorFailing
        exp_alerts:
          - exp_labels:
              severity: page
              condition: failure_rate
            exp_annotations:
              summary: The DLP inspector fails more than 1 % of inspections (FR-47).
              runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/dlp-inspector.md
  - interval: 1m
    input_series:
      - series: 'dlp_inspector_failures_total{kind="timeout"}'
        values: '0+1x40'
      - series: 'dlp_inspection_results_total{state="inspected", reason="none"}'
        values: '0+200x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: DlpInspectorFailing
        exp_alerts: []
