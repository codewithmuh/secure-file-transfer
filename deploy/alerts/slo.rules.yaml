  - name: slo-burn
    rules:
      # Fast or steady burn: at this pace the budget is gone in 2 days (14.4) or 5 days (6).
      - alert: ErrorBudgetBurn
        expr: |
          (
            slo:sli_error:ratio_rate1h > on(slo) group_left() (14.4 * slo:error_budget)
            and slo:sli_error:ratio_rate5m > on(slo) group_left() (14.4 * slo:error_budget)
            or
            slo:sli_error:ratio_rate6h > on(slo) group_left() (6 * slo:error_budget)
            and slo:sli_error:ratio_rate30m > on(slo) group_left() (6 * slo:error_budget)
          )
          and on(slo) slo:sli_events:rate6h * 21600 >= 10
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The {{ $labels.slo }} objective is burning its error budget fast enough to empty it within days.
          runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/slo-burn.md

      # Slow burn: at this pace the budget is gone before the 28 days are (3 or 1).
      - alert: ErrorBudgetBurn
        expr: |
          (
            slo:sli_error:ratio_rate1d > on(slo) group_left() (3 * slo:error_budget)
            and slo:sli_error:ratio_rate2h > on(slo) group_left() (3 * slo:error_budget)
            or
            slo:sli_error:ratio_rate3d > on(slo) group_left() (1 * slo:error_budget)
            and slo:sli_error:ratio_rate6h > on(slo) group_left() (1 * slo:error_budget)
          )
          and on(slo) slo:sli_events:rate3d * 259200 >= 10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: The {{ $labels.slo }} objective is burning its error budget faster than 28 days allow.
          runbook_url: https://github.com/codewithmuh/secure-file-transfer/blob/main/docs/runbooks/slo-burn.md

  # The 28-day report (NFR-1's rolling window, Grafana's SLO dashboard): bad and all events every 5 minutes outside
  # drill windows, then their sums over 28 days. Evaluated every 5 minutes, which is enough for a 28-day figure.
  - name: slo-report
    interval: 5m
    rules:
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: availability
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(http_requests_total[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: availability
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{route!~".*/content|/v1/audit/exports"}[5m]))
            - sum(rate(http_request_duration_seconds_bucket{route!~".*/content|/v1/audit/exports", le=~"0\\.3"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: latency-p95
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{route!~".*/content|/v1/audit/exports"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: latency-p95
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{route!~".*/content|/v1/audit/exports"}[5m]))
            - sum(rate(http_request_duration_seconds_bucket{route!~".*/content|/v1/audit/exports", le=~"1(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: latency-p99
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{route!~".*/content|/v1/audit/exports"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: latency-p99
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(time_to_shareable_seconds_count{size_class="small"}[5m]))
            - sum(rate(time_to_shareable_seconds_bucket{size_class="small", le=~"120(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: time-to-shareable-small
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(time_to_shareable_seconds_count{size_class="small"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: time-to-shareable-small
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(time_to_shareable_seconds_count{size_class="large"}[5m]))
            - sum(rate(time_to_shareable_seconds_bucket{size_class="large", le=~"900(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: time-to-shareable-large
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(time_to_shareable_seconds_count{size_class="large"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: time-to-shareable-large
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
            - sum(rate(scan_pass_duration_seconds_bucket{pool="small", le=~"60(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-small-p95
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-small-p95
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
            - sum(rate(scan_pass_duration_seconds_bucket{pool="small", le=~"180(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-small-p99
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-small-p99
      - record: slo:sli_bad_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="large"}[5m]))
            - sum(rate(scan_pass_duration_seconds_bucket{pool="large", le=~"600(\\.0)?"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-large-p95
      - record: slo:sli_events_outside_drills:rate5m
        expr: |
          sum(rate(scan_pass_duration_seconds_count{pool="large"}[5m]))
          unless on() (max(sft_drill_active) > 0)
        labels:
          slo: scan-pass-large-p95
      - record: slo:sli_error:ratio_28d
        expr: |
          sum by (slo) (sum_over_time(slo:sli_bad_outside_drills:rate5m[28d]))
            /
          sum by (slo) (sum_over_time(slo:sli_events_outside_drills:rate5m[28d]))
      # 1 is a full budget, 0 an empty one, below 0 an objective missed over the 28 days.
      - record: slo:error_budget_remaining:ratio_28d
        expr: 1 - slo:sli_error:ratio_28d / on(slo) slo:error_budget
