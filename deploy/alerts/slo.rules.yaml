        labels:
          slo: time-to-shareable-large
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (
            sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
              - sum(rate(scan_pass_duration_seconds_bucket{pool="small", le=~"60(\\.0)?"}[5m]))
          )
            /
          sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
        labels:
          slo: scan-pass-small-p95
      - record: slo:sli_events:rate5m
        expr: sum(rate(scan_pass_duration_seconds_count{pool="small"}[5m]))
        labels:
          slo: scan-pass-small-p95
      - record: slo:sli_error:ratio_rate5m
