# The system node group runs only the platform (ADR-0004, ADR-0021): its pods' security group lets the proxy reach NAT,
# so an application pod there would be one step from the internet. Outside the system namespaces a pod may not
# tolerate the system taint (nor every taint), select the system pool, or name a node and skip the scheduler.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sft-system-pool-platform-only
  labels:
    {{- include "policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/description: Only platform namespaces may tolerate or select the system node pool.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    {{- include "policies.podRules" . | nindent 4 }}
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: {{ toJson .Values.systemNamespaces }}
  {{- include "policies.autogen" . | nindent 2 }}
  validations:
  - expression: >-
      object.spec.?tolerations.orValue([]).all(t,
        !(t.?key.orValue('') == '' && t.?operator.orValue('Equal') == 'Exists') &&
        !(t.?key.orValue('') == 'sft.io/pool' &&
          (t.?operator.orValue('Equal') == 'Exists' || t.?value.orValue('') == 'system')))
    message: Only platform namespaces may tolerate the system node pool's taint sft.io/pool=system (ADR-0021).
  - expression: >-
      !('sft.io/pool' in object.spec.?nodeSelector.orValue({})) ||
      object.spec.nodeSelector['sft.io/pool'] != 'system'
    message: Only platform namespaces may select the system node pool (ADR-0021).
  - expression: >-
      !object.spec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.?nodeSelectorTerms.orValue([])
        .exists(term, term.?matchExpressions.orValue([]).exists(e, e.key == 'sft.io/pool' &&
          (e.operator == 'Exists' || (e.operator == 'In' && 'system' in e.?values.orValue([])))))
    message: Only platform namespaces may require the system node pool by affinity (ADR-0021).
---
# A pod that names its node skips the scheduler and with it the NoSchedule taint. Only at creation: a scheduled pod
# carries the node name the scheduler bound it to.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sft-no-node-name
  labels:
    {{- include "policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/description: Pods outside platform namespaces may not set spec.nodeName.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [pods]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: {{ toJson .Values.systemNamespaces }}
  {{- include "policies.autogen" . | nindent 2 }}
  validations:
  - expression: >-
      object.spec.?nodeName.orValue('') == ''
    message: Pods may not name their node; the scheduler places them (ADR-0021).
