{{- $registry := required "registry is required" .Values.registry -}}
# Where images may come from (ADR-0007, T-70): our registry only, by digest. sft/* images are our builds, whose
# signatures sft-signed-images checks; mirror/* images are third-party copies, admitted only with a digest reviewed in
# Git. The EKS add-ons come from AWS's registry, in kube-system only (sft-kube-system-images).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sft-image-sources
  labels:
    {{- include "policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/description: Images only from our registry, by digest; mirror images only with a reviewed digest.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    {{- include "policies.podRules" . | nindent 4 }}
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system]
  {{- include "policies.autogen" . | nindent 2 }}
  variables:
  {{- include "policies.containers" . | nindent 2 }}
  - name: ours
    expression: '{{ printf "%s/sft/" $registry | quote }}'
  - name: mirror
    expression: '{{ printf "%s/mirror/" $registry | quote }}'
  - name: mirrorDigests
    expression: '{{ toJson .Values.mirrorDigests }}'
  validations:
  - expression: >-
      variables.containers.all(c, c.image.contains('@sha256:'))
    message: Every image must be pinned by digest (ADR-0007).
  - expression: >-
      variables.containers.all(c,
        c.image.startsWith(variables.ours) ||
        (c.image.startsWith(variables.mirror) && c.image.split('@').size() == 2 &&
         c.image.split('@')[1] in variables.mirrorDigests))
    message: >-
      Images must come from our registry: sft/ for our builds, or mirror/ with a digest reviewed in Git (ADR-0007).
---
# kube-system is outside the webhooks (ADR-0004), so this runs in the background reports, which alert on a violation:
# our registry by digest, or the named EKS add-ons from AWS's registry for this Region (ADR-0004, ADR-0021).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sft-kube-system-images
  labels:
    {{- include "policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/description: kube-system runs our images or the named EKS add-ons only.
spec:
  validationActions: [Audit]
  failurePolicy: Fail
  matchConstraints:
    {{- include "policies.podRules" . | nindent 4 }}
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [kube-system]
  {{- include "policies.autogen" . | nindent 2 }}
  variables:
  {{- include "policies.containers" . | nindent 2 }}
  - name: ours
    expression: '{{ printf "%s/sft/" $registry | quote }}'
  - name: mirror
    expression: '{{ printf "%s/mirror/" $registry | quote }}'
  - name: mirrorDigests
    expression: '{{ toJson .Values.mirrorDigests }}'
  - name: addons
    expression: >-
      {{ toJson .Values.eksAddonRepositories }}.map(r, {{ printf "%s/" (required "eksAddonRegistry is required" .Values.eksAddonRegistry) | quote }} + r)
  validations:
  - expression: >-
      variables.containers.all(c,
        variables.addons.exists(r, c.image.startsWith(r + ':') || c.image.startsWith(r + '@')) ||
        (c.image.startsWith(variables.ours) && c.image.contains('@sha256:')) ||
        (c.image.startsWith(variables.mirror) && c.image.split('@').size() == 2 &&
         c.image.split('@')[1] in variables.mirrorDigests))
    message: kube-system runs only the named EKS add-ons, or our images by digest (ADR-0004, ADR-0007).
