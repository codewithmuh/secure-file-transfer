# Default deny for the proxy's namespace, then: each listener only from its own workload's pods, the health port from
# Prometheus, and out only to CoreDNS and to HTTPS (NAT, and S3 through the gateway endpoint) (ADR-0021).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress-proxy.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "egress-proxy.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
  {{- range .Values.listeners }}
  {{- $port := .port }}
  {{- range .clients }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .namespace }}
      podSelector:
        matchLabels:
          {{- toYaml .podLabels | nindent 10 }}
    ports:
    - port: {{ $port }}
      protocol: TCP
  {{- end }}
  {{- end }}
  {{- range .Values.metricsClients }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .namespace }}
      podSelector:
        matchLabels:
          {{- toYaml .podLabels | nindent 10 }}
    ports:
    - port: {{ $.Values.healthPort }}
      protocol: TCP
  {{- end }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 443
      protocol: TCP
