# Trivy misconfiguration exceptions. Each entry names the check, the files it applies to (a glob, so it matches
# whether Trivy scans infra/ or the whole repository), and why it is accepted, with its threat-model reference.
# infra/scripts/check.sh trivy fails on every severity, so anything not listed here fails CI. Add an entry only with
# a reason a reviewer can check, and never for a whole check without paths.
misconfigurations:
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/tfstate-backend/main.tf"
    statement: >-
      The Terraform state buckets record access through CloudTrail S3 data events, not S3 server access logs. The
      organization trail, which the shared stack creates as CloudTrail's delegated administrator (#55), logs data
      events on every sft-*-tfstate-* bucket into the shared account's log archive under Object Lock, where a read or write by anyone but the Terraform roles stands out (T-73, T-75). Server access
      logs would need a log bucket in every account and Region, before the state bucket exists, that is itself a
      bucket without logging.
  - id: AVD-AWS-0143 # IAM policy attached directly to a user
    paths:
      - "**/modules/emergency-user/main.tf"
    statement: >-
      The emergency user of authn-authz 8.4 is the one IAM user in each member account and holds AdministratorAccess
      directly, by design (#81). A group would add a second place its permissions could be changed or removed
      (AttachGroupPolicy, DetachGroupPolicy, DeleteGroup) that SCP 4 doesn't guard, while SCP 4 already lets only
      Admin attach, detach or delete a user's policies, create users or set their passwords and MFA devices (T-74).
  - id: AVD-AWS-0104 # security group egress to 0.0.0.0/0
    paths:
      - "**/modules/network/security-groups.tf"
    statement: >-
      Only the system node group's security group, and only TCP 443: the egress proxy and the Systems Manager agent
      reach the internet through NAT there, which is the design (ADR-0021). Every other outbound connection goes
      through the proxy, whose per-workload allowlists name each destination; network policies keep every other pod
      on system nodes off NAT, DNS Firewall answers only allowed names, and main and scan nodes may leave the VPC only
      for S3's prefix list (T-53, residual R-15).
  - id: AVD-AWS-0178 # VPC flow logs
    paths:
      - "**/modules/network/main.tf"
    statement: >-
      The module has a flow log for all traffic (aws_flow_log.this), created once the root sets
      flow_log_destination_arn. Its destination is the environment's S3 log bucket under the logs key (capacity A19,
      encryption 3.1), which the data layer creates after the network, so a fresh build applies the network a second
      time with it (infra/README.md, "Apply order"). Trivy sees the default, null. Flow logs are part of T-53's
      detection, with the proxy's byte logs and GuardDuty.
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/files-buckets/main.tf"
      - "**/modules/audit-archive/main.tf"
    statement: >-
      Encryption 3.1 decides against S3 server access logs: they support only SSE-S3, an exception to NFR-13 for logs
      that would hold every object key and requester. CloudTrail S3 data events are the storage access log instead,
      for NFR-15's daily match: the files buckets' through the environment's trail into the shared account's log
      archive under Object Lock, so a break-glass session can't erase its own record (authn-authz 8.3), and the prod
      archive's through the retained stack's trail (encryption 8.4). Threat model T-51, T-75.
  - id: AVD-AWS-0342 # iam:PassRole
    paths:
      - "**/modules/terraform-oidc-roles/permissions-storage.tf"
    statement: >-
      The deploy role passes three roles it creates in the data layer, each by exact ARN and each only to its one
      service (iam:PassedToService): sft-<env>-s3-replication to S3, sft-<env>-malware-protection to GuardDuty and
      sft-<env>-events-delivery to EventBridge. Replication rules, the malware protection plan and the rule targets
      can't be made without it. SCP 4 keeps these policies with Admin, so the deploy role can't widen them (T-71).
  - id: AVD-AWS-0342 # iam:PassRole
    paths:
      - "**/modules/terraform-oidc-roles/permissions-cluster.tf"
    statement: >-
      The cluster layer (#103) must pass roles: the deploy role passes the cluster and node roles to EKS, the workload
      roles to Pod Identity, the Karpenter node role into its instance profile and the data layer's execution role to
      EventBridge, each statement limited to those exact role ARNs and iam:PassedToService. The workload permissions
      boundary lets a cluster-layer role pass only the Karpenter node role, which Karpenter's own policy also limits to
      ec2.amazonaws.com. The roles that can be passed all carry the same boundary, which allows no IAM change and no
      sts:AssumeRole, so passing one gains nothing beyond the workload's own rights (T-71).
