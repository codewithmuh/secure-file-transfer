# Trivy misconfiguration exceptions. Each entry names the check, the files it applies to (a glob, so it matches
# whether Trivy scans infra/ or the whole repository), and why it is accepted, with its threat-model reference.
# infra/scripts/check.sh trivy fails on every severity, so anything not listed here fails CI. Add an entry only with
# a reason a reviewer can check, and never for a whole check without paths.
misconfigurations:
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/tfstate-backend/main.tf"
    statement: >-
      The Terraform state buckets record access through CloudTrail S3 data events, not S3 server access logs. The
      organization trail, which the shared stack creates as CloudTrail's delegated administrator (#55), logs data
      events on every sft-*-tfstate-* bucket into the shared account's log archive under Object Lock, where a read
      or write by anyone but the Terraform roles stands out (T-73, T-75; modules/log-archive, #105). Server access
      logs would need a log bucket in every account and Region, before the state bucket exists, that is itself a
      bucket without logging.
  - id: AVD-AWS-0143 # IAM policy attached directly to a user
    paths:
      - "**/modules/emergency-user/main.tf"
    statement: >-
      The emergency user of authn-authz 8.4 is the one IAM user in each member account and holds AdministratorAccess
      directly, by design (#81). A group would add a second place its permissions could be changed or removed
      (AttachGroupPolicy, DetachGroupPolicy, DeleteGroup) that SCP 4 doesn't guard, while SCP 4 already lets only
      Admin attach, detach or delete a user's policies, create users or set their passwords and MFA devices (T-74).
  - id: AVD-AWS-0104 # security group egress to 0.0.0.0/0
    paths:
      - "**/modules/network/security-groups.tf"
    statement: >-
      Only the system node group's security group, and only TCP 443: the egress proxy and the Systems Manager agent
      reach the internet through NAT there, which is the design (ADR-0021). Every other outbound connection goes
      through the proxy, whose per-workload allowlists name each destination; network policies keep every other pod
      on system nodes off NAT, DNS Firewall answers only allowed names, and main and scan nodes may leave the VPC only
      for S3's prefix list (T-53, residual R-15).
  - id: AVD-AWS-0178 # VPC flow logs
    paths:
      - "**/modules/network/main.tf"
    statement: >-
      The module has a flow log for all traffic (aws_flow_log.this), created once the root sets
      flow_log_destination_arn. Its destination is the environment's S3 log bucket under the logs key (capacity A19,
      encryption 3.1), which the data layer creates after the network, so a fresh build applies the network a second
      time with it (infra/README.md, "Apply order"). Trivy sees the default, null. Flow logs are part of T-53's
      detection, with the proxy's byte logs and GuardDuty.
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/files-buckets/main.tf"
      - "**/modules/audit-archive/main.tf"
    statement: >-
      Encryption 3.1 decides against S3 server access logs: they support only SSE-S3, an exception to NFR-13 for logs
      that would hold every object key and requester. CloudTrail S3 data events are the storage access log instead,
      for NFR-15's daily match: the files buckets' through the environment's trail into the shared account's log
      archive under Object Lock, so a break-glass session can't erase its own record (authn-authz 8.3), and the prod
      archive's through the retained stack's trail (encryption 8.4). Threat model T-51, T-75.
  - id: AVD-AWS-0342 # iam:PassRole
    paths:
      - "**/modules/terraform-oidc-roles/permissions-storage.tf"
    statement: >-
      The deploy role passes three roles it creates in the data layer, each by exact ARN and each only to its one
      service (iam:PassedToService): sft-<env>-s3-replication to S3, sft-<env>-malware-protection to GuardDuty and
      sft-<env>-events-delivery to EventBridge. Replication rules, the malware protection plan and the rule targets
      can't be made without it. SCP 4 keeps these policies with Admin, so the deploy role can't widen them (T-71).
  - id: AVD-AWS-0342 # iam:PassRole
    paths:
      - "**/modules/terraform-oidc-roles/permissions-cluster.tf"
    statement: >-
      The cluster layer (#103) must pass roles: the deploy role passes the cluster and node roles to EKS, the workload
      roles to Pod Identity, the Karpenter node role into its instance profile and the data layer's execution role to
      EventBridge, each statement limited to those exact role ARNs and iam:PassedToService. The workload permissions
      boundary lets a cluster-layer role pass only the Karpenter node role, which Karpenter's own policy also limits to
      ec2.amazonaws.com. The roles that can be passed all carry the same boundary, which allows no IAM change and no
      sts:AssumeRole, so passing one gains nothing beyond the workload's own rights (T-71).
  - id: AVD-AWS-0053 # public load balancer
    paths:
      - "**/modules/edge/load-balancer.tf"
    statement: >-
      The API's load balancer is internet-facing by design: recipients and uploaders reach the API from anywhere
      (ADR-0021, abuse 3.1). It has one HTTPS listener with the TLS 1.3 post-quantum policy, drops invalid headers,
      runs desync mitigation in strictest mode and fails closed when WAF can't be reached; the API web ACL's managed
      and rate rules sit in front of it, and its security group reaches only the API's two ports on the main nodes,
      never the scan nodes (T-53, AB-10).
  - id: AVD-AWS-0132 # S3 encryption with a customer managed key
    paths:
      - "**/modules/edge/logs.tf"
      - "**/modules/edge/web-bucket.tf"
    statement: >-
      Two buckets use SSE-S3 on purpose (encryption 3.1). The load balancer's access logs support only SSE-S3, the
      exception to NFR-13 recorded in encryption 3.1; they hold no tokens, which travel in the URL fragment. The web
      bundle buckets hold public content that every browser downloads; CloudFront reads them through origin access
      control and only the release pipeline writes them (ADR-0008, T-02). The WAF log bucket in logs.tf uses the
      environment's logs key.
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/edge/logs.tf"
      - "**/modules/edge/web-bucket.tf"
      - "**/modules/log-archive/main.tf"
    statement: >-
      Log buckets don't log to more log buckets, which would only move the question one bucket on: the edge's WAF and
      load balancer log buckets and the organization's log archive are written by AWS's log delivery services and
      read by people only through their own sessions, which the organization trail records as management events and
      KMS calls (T-75). The web bundle buckets hold public content; CloudFront's own standard logs record every read,
      and only the release pipeline writes them (ADR-0008, T-02). Changes to any of them are management events in the
      organization trail.
  - id: AVD-AWS-0162 # CloudTrail to CloudWatch Logs
    paths:
      - "**/modules/log-archive/main.tf"
    statement: >-
      The organization trail delivers to the Object Lock log archive only. Alerts on the events that matter (sign-ins,
      break-glass, changes to logging and keys) come from EventBridge rules in each account (authn-authz 8.3, ADR-0006),
      which see every management event without a log group; a CloudWatch Logs copy of the whole organization's trail
      would add cost and a second, mutable store of the same records (T-75).
  - id: AVD-AWS-0163 # CloudTrail bucket access logging
    paths:
      - "**/modules/log-archive/main.tf"
    statement: >-
      The trail's bucket is the log archive itself, under Object Lock in compliance mode for 90 days, so no record can
      be changed or deleted, whoever reads it (T-75). Reads by people go through AuditReader sessions that the trail
      records as management events and KMS decrypt calls; server access logs would need yet another bucket outside
      the lock.
  - id: AVD-AWS-0031 # ECR immutable tags
    paths:
      - "**/modules/registry/main.tf"
    statement: >-
      Tags are immutable except one pattern, sha256-*, cosign's fallback tags for signatures and attestations
      (sha256-<digest>.sig and .att), which a re-sign must rewrite (#107). Images are deployed by digest, never by
      tag, and admission accepts only digests with a valid signature from our build identity or a listed vendor, so
      a rewritten fallback tag can't change what runs (ADR-0007, T-70).
  - id: AVD-AWS-0066 # Lambda tracing
    paths:
      - "**/modules/signin-triggers/main.tf"
    statement: >-
      The sign-in triggers' function (#238) runs in the private subnets with no way out but the interface endpoints,
      and there is no X-Ray endpoint: Active tracing would need one, or a route out, for a function that answers in
      milliseconds and keeps no state. Its JSON logs go to its own log group under the logs key, every refusal is
      counted and logged by limit ID, and every attempt and success reaches the audit log through the signin-events
      queue (NFR-15), which is what an investigation of sign-ins reads (T-89, authn-authz 2.4).
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/observability/buckets.tf"
    statement: >-
      Loki's and Tempo's buckets (#243) are written and read only by their own Pod Identity roles, whose boundary
      allows no other use, and hold derived logs and traces kept 90 and 14 days. Server access logs would need another
      log bucket under SSE-S3 (encryption 3.1); the organization trail records every change to the buckets and the
      logs key's use as KMS events (T-75).
  - id: AVD-AWS-0090 # S3 bucket versioning
    paths:
      - "**/modules/observability/buckets.tf"
    statement: >-
      Loki and Tempo write each object once and delete it at the end of their retention (ADR-0009). A kept version
      would hold logs, which are customer data under NFR-21, past the PRD's 90 days and past an environment's
      teardown until it expired, and nothing restores telemetry from a version: a lost object is a gap in history,
      not lost customer data (#243).
  - id: AVD-AWS-0342 # iam:PassRole
    paths:
      - "**/modules/terraform-oidc-roles/permissions-observability.tf"
    statement: >-
      The cluster-bootstrap layer passes the four observability roles it creates (#243), by exact ARN, only to Pod
      Identity (iam:PassedToService = pods.eks.amazonaws.com), which can't associate a role without it. Each carries
      the observability boundary, which allows no IAM change and no sts:AssumeRole, so passing one gains nothing
      beyond telemetry storage, alert publishing and metric reads (T-71).
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/environments/prod/retained/state.tf"
      - "**/environments/prod/retained/trail.tf"
    statement: >-
      The retained stack's state and trail buckets (encryption 8.4, #263), like every state bucket, record access
      through CloudTrail rather than S3 server access logs, which support only SSE-S3 (encryption 3.1): while prod runs
      the organization trail's data events on sft-*-tfstate-* buckets, and the retained trail's management events
      from teardown on. The trail bucket is itself a log bucket, and logging it would only move the question one
      bucket on. Changes to either bucket's guards page through the retained stack's rules (retained-stack-change.md;
      T-73, T-75).
  - id: AVD-AWS-0162 # CloudTrail to CloudWatch Logs
    paths:
      - "**/environments/prod/retained/trail.tf"
    statement: >-
      The retained trail (encryption 8.4, #263) exists so EventBridge sees the archive's calls after teardown; its
      rules (retained-stack-change.md) need no log group, and a CloudWatch Logs copy would add a monthly cost against
      NFR-19's $7 and a second, mutable store of the same records (T-75).
  - id: AVD-AWS-0163 # CloudTrail bucket access logging
    paths:
      - "**/environments/prod/retained/trail.tf"
    statement: >-
      The retained trail's bucket denies deleting a log file or changing the bucket to everyone but the retained
      stack's deploy role and Admin, and keeps every version; reads by people are management events the trail itself
      records. Server access logs would need another bucket, outside NFR-19's budget (encryption 8.4, T-75).
  - id: AVD-AWS-0089 # S3 bucket logging
    paths:
      - "**/modules/probe-mailbox/main.tf"
    statement: >-
      The probe mailbox (#259) holds only the synthetic probe's and the load test's own emails, for a day. Server
      access logs support only SSE-S3 (encryption 3.1) and would hold every message's key; writes are SES's alone and
      reads are the probe's and the load test's roles, whose calls CloudTrail records. Threat model T-51, T-75.
